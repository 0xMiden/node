[package]
name = "xusdc-genesis"
version = "0.0.0"
edition = "2021"
publish = false
description = "xUSDC-on-Miden genesis tool: builds the genesis xUSDC faucet and its distributor offline and emits the node's genesis inputs for them"

[dependencies]
# `testing` provides `AccountId::dummy`, the placeholder fee faucet id the genesis grind runs
# with (the encoding crate already enables the feature on this same dependency).
miden-protocol = { version = "=0.17.0-rc.7", features = ["testing"] }
miden-standards = { version = "=0.17.0-rc.7" }
miden-objects = { version = "=0.17.0-rc.7" }
xusdc-encoding = { path = "../xusdc-encoding" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
assert_matches = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }
