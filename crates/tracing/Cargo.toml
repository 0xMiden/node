[package]
authors.workspace      = true
description            = "Miden node tracing conventions and OpenTelemetry integration"
edition.workspace      = true
homepage.workspace     = true
keywords               = ["miden", "node", "tracing"]
license.workspace      = true
name                   = "miden-node-tracing"
readme                 = "README.md"
repository.workspace   = true
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[lib]
doctest = false

[features]
# Enables tracing setup backed by OpenTelemetry's test exporter.
testing = ["opentelemetry_sdk/testing"]

[dependencies]
anyhow                   = { workspace = true }
bytes                    = { version = "1.10" }
http                     = { workspace = true }
http-body-util           = { version = "0.1" }
miden-node-tracing-macro = { workspace = true }
miden-protocol           = { workspace = true }
opentelemetry            = { workspace = true }
opentelemetry-otlp       = { default-features = false, features = ["grpc-tonic", "tls-roots", "trace"], version = "0.31" }
opentelemetry_sdk        = { features = ["rt-tokio"], version = "0.31" }
tokio                    = { features = ["rt"], workspace = true }
tonic                    = { default-features = true, workspace = true }
tower-http               = { features = ["catch-panic"], workspace = true }
tower_governor           = { workspace = true }
tracing                  = { workspace = true }
tracing-forest           = { features = ["chrono"], optional = true, version = "0.3" }
tracing-opentelemetry    = { version = "0.32" }
tracing-subscriber       = { workspace = true }

[dev-dependencies]
opentelemetry_sdk = { features = ["testing"], version = "0.31" }
thiserror         = { workspace = true }
trybuild          = { workspace = true }

[package.metadata.cargo-shear]
ignored-paths = ["tests/ui/tracing_macros/*.rs"]
