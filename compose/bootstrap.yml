services:
  bootstrap-usdcx:
    image: ${MIDEN_USDCX_GENESIS_IMAGE:-miden-usdcx-genesis}
    pull_policy: missing
    network_mode: none
    environment:
      # USDCx has six decimal places. This amount is one billion USDCx.
      MIDEN_USDCX_INITIAL_SUPPLY: ${MIDEN_USDCX_INITIAL_SUPPLY:-1000000000000000}
    volumes:
      - node-data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -f /data/usdcx/.bootstrapped ]; then
          echo "USDCx already bootstrapped."
          exit 0
        fi
        if [ -d /data/usdcx ] || [ -d /data/genesis ]; then
          echo "Reset the local network with make local-network-delete before bootstrap." >&2
          exit 1
        fi

        mkdir /data/usdcx
        cd /data/usdcx

        echo "Creating the bootstrap admin and funding account..."
        DISTRIBUTOR_OUTPUT="$$(miden-usdcx-genesis new-distributor)"
        printf '%s\n' "$${DISTRIBUTOR_OUTPUT}"
        DISTRIBUTOR_ID="$$(printf '%s\n' "$${DISTRIBUTOR_OUTPUT}" | sed -n 's/^  hex: *//p')"
        if [ -z "$${DISTRIBUTOR_ID}" ]; then
          echo "USDCx genesis did not report the distributor account ID." >&2
          exit 1
        fi

        cat > config.json <<EOF
        {
          "accounts": {
            "owner": "$${DISTRIBUTOR_ID}",
            "attest_admins": [],
            "pausers": [],
            "unpausers": [],
            "blocklist_managers": []
          },
          "faucet": {
            "seed": "0x55534443582d4641554345540000000000000000000000000000000000000000",
            "token_supply": $${MIDEN_USDCX_INITIAL_SUPPLY},
            "domain": 10007,
            "min_burn_amount": 1,
            "verification_base_fee": 7,
            "attesters": []
          }
        }
        EOF

        echo "Creating the native USDCx faucet and prefunding the distributor..."
        miden-usdcx-genesis faucet
        miden-usdcx-genesis prefund
        touch /data/usdcx/.bootstrapped

  bootstrap-validator:
    image: ${MIDEN_VALIDATOR_IMAGE:-miden-validator}
    pull_policy: missing
    networks:
      - dkg
    configs:
      - source: validator-1-storage-key-bundle
        target: /fixtures/storage-key/validator-1.bundle
      - source: validator-2-storage-key-bundle
        target: /fixtures/storage-key/validator-2.bundle
      - source: validator-3-storage-key-bundle
        target: /fixtures/storage-key/validator-3.bundle
    environment:
      MIDEN_VALIDATOR_STORAGE_KEY_EPOCH: ${MIDEN_VALIDATOR_STORAGE_KEY_EPOCH:-0909090909090909090909090909090909090909090909090909090909090909}
      MIDEN_VALIDATOR_USE_STORAGE_KEY_FIXTURE: ${MIDEN_VALIDATOR_USE_STORAGE_KEY_FIXTURE:-false}
      MIDEN_VALIDATOR_1_SIGNING_KEY: ${MIDEN_VALIDATOR_1_SIGNING_KEY:-0101010101010101010101010101010101010101010101010101010101010101}
      MIDEN_VALIDATOR_2_SIGNING_KEY: ${MIDEN_VALIDATOR_2_SIGNING_KEY:-0303030303030303030303030303030303030303030303030303030303030303}
      MIDEN_VALIDATOR_3_SIGNING_KEY: ${MIDEN_VALIDATOR_3_SIGNING_KEY:-0404040404040404040404040404040404040404040404040404040404040404}
    volumes:
      - node-data:/data
    depends_on:
      bootstrap-usdcx:
        condition: service_completed_successfully
      dkg-relay:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -f /data/validators/.bootstrapped ] &&
           [ -s /data/genesis/native-faucet-id ] &&
           [ -s /data/genesis/validator-signing-public-keys ]; then
          echo "Validators already bootstrapped."
          exit 0
        fi

        mkdir /data/genesis /data/validators /data/accounts

        echo "Generating persistent validator endpoint identities..."
        ENDPOINTS=/data/validators/endpoints
        mkdir "$${ENDPOINTS}"
        for VALIDATOR in 1 2 3; do
          ENDPOINT_OUTPUT="$$(miden-validator dkg generate-endpoint \
            --output-file "$${ENDPOINTS}/$${VALIDATOR}.secret")"
          ENDPOINT_ID="$$(printf '%s\n' "$${ENDPOINT_OUTPUT}" | sed -n 's/^Iroh endpoint ID: //p')"
          if [ -z "$${ENDPOINT_ID}" ]; then
            echo "Validator $${VALIDATOR} did not report its endpoint ID." >&2
            exit 1
          fi
          printf '%s\n' "$${ENDPOINT_ID}" > "$${ENDPOINTS}/$${VALIDATOR}.id"
        done

        echo "Building genesis block..."
        # The validator set consists of the public keys derived from the three
        # signing keys configured in validator.yml, ordered by validator service.
        VALIDATOR_1_PUBLIC_KEY="$$(miden-validator pubkey --signing-key.hex "$${MIDEN_VALIDATOR_1_SIGNING_KEY}")"
        VALIDATOR_2_PUBLIC_KEY="$$(miden-validator pubkey --signing-key.hex "$${MIDEN_VALIDATOR_2_SIGNING_KEY}")"
        VALIDATOR_3_PUBLIC_KEY="$$(miden-validator pubkey --signing-key.hex "$${MIDEN_VALIDATOR_3_SIGNING_KEY}")"
        GENESIS_OUTPUT="$$(
          miden-validator genesis \
            --genesis-block-directory /data/genesis \
            --accounts-directory /data/accounts \
            --native-faucet /data/usdcx/usdcx-faucet.mac \
            --funding-account /data/usdcx/distributor.genesis.mac \
            --verification-base-fee 7 \
            --timestamp 1717344256 \
            --validator.key "$${VALIDATOR_1_PUBLIC_KEY}" \
            --validator.key "$${VALIDATOR_2_PUBLIC_KEY}" \
            --validator.key "$${VALIDATOR_3_PUBLIC_KEY}"
        )"
        printf '%s\n' "$${GENESIS_OUTPUT}"
        NATIVE_FAUCET_ID="$$(
          printf '%s\n' "$${GENESIS_OUTPUT}" | sed -n 's/^Native faucet account id: //p'
        )"
        if [ -z "$${NATIVE_FAUCET_ID}" ]; then
          echo "Genesis did not report the native faucet account ID." >&2
          exit 1
        fi
        printf '%s\n' "$${NATIVE_FAUCET_ID}" > /data/genesis/native-faucet-id

        printf '%s,%s,%s\n' \
          "$${VALIDATOR_1_PUBLIC_KEY}" \
          "$${VALIDATOR_2_PUBLIC_KEY}" \
          "$${VALIDATOR_3_PUBLIC_KEY}" > /data/genesis/validator-signing-public-keys

        for VALIDATOR in 1 2 3; do
          echo "Bootstrapping validator $${VALIDATOR}..."
          miden-validator bootstrap \
            --data-directory "/data/validators/$${VALIDATOR}" \
            --genesis /data/genesis/genesis.dat
        done

        if [ "$${MIDEN_VALIDATOR_USE_STORAGE_KEY_FIXTURE}" = "true" ]; then
          echo "Staging the insecure storage key fixture..."
          for VALIDATOR in 1 2 3; do
            STORAGE_KEY="/data/validators/$${VALIDATOR}/storage-key.bundle"
            cp "/fixtures/storage-key/validator-$${VALIDATOR}.bundle" "$${STORAGE_KEY}"
            chmod 600 "$${STORAGE_KEY}"
            miden-validator dkg validate-fixture \
              --bundle-file "$${STORAGE_KEY}" \
              --expected-participant "$${VALIDATOR}"
          done
        else
          echo "Running the peer-to-peer storage key DKG ceremony..."
          DKG_PIDS=
          # Stop the remaining participants if bootstrap exits before every ceremony command succeeds.
          #
          # Each command waits for its peers, so a failed participant must not leave the others running.
          trap '
            kill $${DKG_PIDS} 2>/dev/null || true
            wait || true
          ' EXIT
          trap 'exit 1' INT TERM

          # Start all participants before waiting for completion.
          #
          # The live ceremony requires peers to exchange messages concurrently.
          for VALIDATOR in 1 2 3; do
            case "$${VALIDATOR}" in
              1) SIGNING_KEY="$${MIDEN_VALIDATOR_1_SIGNING_KEY}" ;;
              2) SIGNING_KEY="$${MIDEN_VALIDATOR_2_SIGNING_KEY}" ;;
              3) SIGNING_KEY="$${MIDEN_VALIDATOR_3_SIGNING_KEY}" ;;
            esac
            set --
            for PEER in 1 2 3; do
              if [ "$${PEER}" != "$${VALIDATOR}" ]; then
                set -- "$$@" --peer.endpoint "$$(cat "$${ENDPOINTS}/$${PEER}.id")"
              fi
            done
            miden-validator dkg participate \
              --genesis /data/genesis/genesis.dat \
              --threshold 2 \
              --epoch "$${MIDEN_VALIDATOR_STORAGE_KEY_EPOCH}" \
              --signing-key.hex "$${SIGNING_KEY}" \
              --endpoint-secret "$${ENDPOINTS}/$${VALIDATOR}.secret" \
              --relay.url http://dkg-relay:3340 \
              --timeout 5m \
              --output-file "/data/validators/$${VALIDATOR}/storage-key.bundle" \
              "$$@" &
            DKG_PIDS="$${DKG_PIDS} $$!"
          done

          # Require every participant to confirm completion before starting the network.
          for DKG_PID in $${DKG_PIDS}; do
            wait "$${DKG_PID}"
          done
          trap - EXIT INT TERM
        fi

        touch /data/validators/.bootstrapped

  bootstrap-node:
    image: ${MIDEN_NODE_IMAGE:-miden-node}
    pull_policy: missing
    volumes:
      - node-data:/data
    entrypoint: ["/bin/sh", "-c"]
    depends_on:
      bootstrap-validator:
        condition: service_completed_successfully
    command:
      - |
        set -e
        if [ -f /data/node/.bootstrapped ]; then
          echo "Node already bootstrapped."
          exit 0
        fi

        mkdir /data/node

        echo "Bootstrapping node..."
        miden-node bootstrap \
          --data-directory /data/node \
          --genesis /data/genesis/genesis.dat

        touch /data/node/.bootstrapped

  deploy-fee-collector:
    image: ${MIDEN_NODE_IMAGE:-miden-node}
    pull_policy: missing
    volumes:
      - node-data:/data
    depends_on:
      bootstrap-node:
        condition: service_completed_successfully
      validator-1:
        condition: service_started
      validator-2:
        condition: service_started
      validator-3:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -f /data/node/.fee-collector-deployed ]; then
          exit 0
        fi
        if [ ! -f /data/node/fee-collector.mac ]; then
          miden-node fee-collector create --data-directory /data/node
        fi
        miden-node fee-collector deploy \
          --data-directory /data/node \
          --validator.url http://validator-1:50101 \
          --validator.url http://validator-2:50101 \
          --validator.url http://validator-3:50101
        touch /data/node/.fee-collector-deployed

  bootstrap-ntx-builder:
    image: ${MIDEN_NTX_BUILDER_IMAGE:-miden-ntx-builder}
    pull_policy: missing
    volumes:
      - node-data:/data
    entrypoint: ["/bin/sh", "-c"]
    depends_on:
      bootstrap-node:
        condition: service_completed_successfully
    command:
      - |
        set -e
        if [ -f /data/ntx-builder/.bootstrapped ]; then
          echo "Network transaction builder already bootstrapped."
          exit 0
        fi

        mkdir /data/ntx-builder

        echo "Bootstrapping network transaction builder..."
        miden-ntx-builder bootstrap \
          --data-directory /data/ntx-builder \
          --genesis /data/genesis/genesis.dat

        touch /data/ntx-builder/.bootstrapped
