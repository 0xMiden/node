services:
  bootstrap-validator:
    image: ${MIDEN_VALIDATOR_IMAGE:-miden-validator}
    pull_policy: missing
    configs:
      - source: genesis
        target: /genesis.toml
      - source: validator-storage-key-setup-context
        target: /fixtures/storage-key/setup-context.wire
      - source: validator-storage-key-public-set
        target: /fixtures/storage-key/public-key-set.wire
      - source: validator-1-storage-key-secret-share
        target: /fixtures/storage-key/validator-1/secret-share.wire
      - source: validator-2-storage-key-secret-share
        target: /fixtures/storage-key/validator-2/secret-share.wire
      - source: validator-3-storage-key-secret-share
        target: /fixtures/storage-key/validator-3/secret-share.wire
    environment:
      MIDEN_VALIDATOR_STORAGE_KEY_EPOCH: ${MIDEN_VALIDATOR_STORAGE_KEY_EPOCH:-0909090909090909090909090909090909090909090909090909090909090909}
      MIDEN_VALIDATOR_USE_STORAGE_KEY_FIXTURE: ${MIDEN_VALIDATOR_USE_STORAGE_KEY_FIXTURE:-false}
      MIDEN_VALIDATOR_1_SIGNING_KEY: ${MIDEN_VALIDATOR_1_SIGNING_KEY:-0101010101010101010101010101010101010101010101010101010101010101}
      MIDEN_VALIDATOR_2_SIGNING_KEY: ${MIDEN_VALIDATOR_2_SIGNING_KEY:-0303030303030303030303030303030303030303030303030303030303030303}
      MIDEN_VALIDATOR_3_SIGNING_KEY: ${MIDEN_VALIDATOR_3_SIGNING_KEY:-0404040404040404040404040404040404040404040404040404040404040404}
    volumes:
      - node-data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -f /data/validators/.bootstrapped ] && [ -s /data/genesis/native-faucet-id ]; then
          echo "Validators already bootstrapped."
          exit 0
        fi

        echo "Cleaning incomplete network bootstrap state..."
        rm -rf \
          /data/accounts \
          /data/genesis \
          /data/node \
          /data/ntx-builder \
          /data/storage-key-dkg \
          /data/validators
        mkdir -p /data/genesis /data/validators /data/accounts

        echo "Building genesis block..."
        # The validator set consists of the public keys derived from the three
        # signing keys configured in validator.yml, ordered by validator service.
        GENESIS_OUTPUT="$$(
          miden-validator genesis \
            --genesis-block-directory /data/genesis \
            --accounts-directory /data/accounts \
            --config /genesis.toml \
            --validator.key "$$(miden-validator pubkey --signing-key.hex "$${MIDEN_VALIDATOR_1_SIGNING_KEY}")" \
            --validator.key "$$(miden-validator pubkey --signing-key.hex "$${MIDEN_VALIDATOR_2_SIGNING_KEY}")" \
            --validator.key "$$(miden-validator pubkey --signing-key.hex "$${MIDEN_VALIDATOR_3_SIGNING_KEY}")"
        )"
        printf '%s\n' "$${GENESIS_OUTPUT}"
        NATIVE_FAUCET_ID="$$(
          printf '%s\n' "$${GENESIS_OUTPUT}" | sed -n 's/^Native faucet account id: //p'
        )"
        if [ -z "$${NATIVE_FAUCET_ID}" ]; then
          echo "Genesis did not report the native faucet account ID." >&2
          exit 1
        fi
        printf '%s\n' "$${NATIVE_FAUCET_ID}" > /data/genesis/native-faucet-id

        for VALIDATOR in 1 2 3; do
          echo "Bootstrapping validator $${VALIDATOR}..."
          miden-validator bootstrap \
            --data-directory "/data/validators/$${VALIDATOR}" \
            --genesis /data/genesis/genesis.dat
        done

        if [ "$${MIDEN_VALIDATOR_USE_STORAGE_KEY_FIXTURE}" = "true" ]; then
          echo "Staging the insecure storage key fixture..."
          for VALIDATOR in 1 2 3; do
            STORAGE_KEY="/data/validators/$${VALIDATOR}/storage-key"
            mkdir -p "$${STORAGE_KEY}"
            printf '%s' "$${MIDEN_VALIDATOR_STORAGE_KEY_EPOCH}" > "$${STORAGE_KEY}/epoch.hex"
            cp /fixtures/storage-key/setup-context.wire "$${STORAGE_KEY}/setup-context.wire"
            cp /fixtures/storage-key/public-key-set.wire "$${STORAGE_KEY}/public-key-set.wire"
            cp "/fixtures/storage-key/validator-$${VALIDATOR}/secret-share.wire" \
              "$${STORAGE_KEY}/secret-share.wire"
            chmod 600 "$${STORAGE_KEY}/secret-share.wire"
            miden-validator dkg validate-fixture \
              --bundle-directory "$${STORAGE_KEY}" \
              --expected-participant "$${VALIDATOR}"
          done
        else
          echo "Running the storage key DKG ceremony..."
          DKG=/data/storage-key-dkg
          mkdir -p "$${DKG}/identity" "$${DKG}/dealings" "$${DKG}/acceptances"

          for VALIDATOR in 1 2 3; do
            case "$${VALIDATOR}" in
              1) SIGNING_KEY="$${MIDEN_VALIDATOR_1_SIGNING_KEY}" ;;
              2) SIGNING_KEY="$${MIDEN_VALIDATOR_2_SIGNING_KEY}" ;;
              3) SIGNING_KEY="$${MIDEN_VALIDATOR_3_SIGNING_KEY}" ;;
            esac
            miden-validator dkg identity \
              --genesis /data/genesis/genesis.dat \
              --epoch "$${MIDEN_VALIDATOR_STORAGE_KEY_EPOCH}" \
              --signing-key.hex "$${SIGNING_KEY}" \
              --output-directory "$${DKG}/identity/$${VALIDATOR}"
          done

          miden-validator dkg prepare \
            --genesis /data/genesis/genesis.dat \
            --threshold 2 \
            --epoch "$${MIDEN_VALIDATOR_STORAGE_KEY_EPOCH}" \
            --registration "$${DKG}/identity/1/registration.toml" \
            --registration "$${DKG}/identity/2/registration.toml" \
            --registration "$${DKG}/identity/3/registration.toml" \
            --output-directory "$${DKG}/ceremony"

          for VALIDATOR in 1 2 3; do
            miden-validator dkg deal \
              --genesis /data/genesis/genesis.dat \
              --ceremony-directory "$${DKG}/ceremony" \
              --identity-secret "$${DKG}/identity/$${VALIDATOR}/identity-secret.wire" \
              --output-directory "$${DKG}/dealings/$${VALIDATOR}"
          done

          for VALIDATOR in 1 2 3; do
            case "$${VALIDATOR}" in
              1) SIGNING_KEY="$${MIDEN_VALIDATOR_1_SIGNING_KEY}" ;;
              2) SIGNING_KEY="$${MIDEN_VALIDATOR_2_SIGNING_KEY}" ;;
              3) SIGNING_KEY="$${MIDEN_VALIDATOR_3_SIGNING_KEY}" ;;
            esac
            miden-validator dkg accept \
              --genesis /data/genesis/genesis.dat \
              --ceremony-directory "$${DKG}/ceremony" \
              --signing-key.hex "$${SIGNING_KEY}" \
              --decryption-dealing "$${DKG}/dealings/1/decryption-dealing.wire" \
              --decryption-dealing "$${DKG}/dealings/2/decryption-dealing.wire" \
              --decryption-dealing "$${DKG}/dealings/3/decryption-dealing.wire" \
              --context-dealing "$${DKG}/dealings/1/context-dealing.wire" \
              --context-dealing "$${DKG}/dealings/2/context-dealing.wire" \
              --context-dealing "$${DKG}/dealings/3/context-dealing.wire" \
              --output-directory "$${DKG}/acceptances/$${VALIDATOR}"
          done

          for VALIDATOR in 1 2 3; do
            case "$${VALIDATOR}" in
              1) SIGNING_KEY="$${MIDEN_VALIDATOR_1_SIGNING_KEY}" ;;
              2) SIGNING_KEY="$${MIDEN_VALIDATOR_2_SIGNING_KEY}" ;;
              3) SIGNING_KEY="$${MIDEN_VALIDATOR_3_SIGNING_KEY}" ;;
            esac
            STORAGE_KEY="/data/validators/$${VALIDATOR}/storage-key"
            miden-validator dkg finalize \
              --genesis /data/genesis/genesis.dat \
              --ceremony-directory "$${DKG}/ceremony" \
              --identity-secret "$${DKG}/identity/$${VALIDATOR}/identity-secret.wire" \
              --private-state "$${DKG}/dealings/$${VALIDATOR}/private-state.wire" \
              --decryption-dealing "$${DKG}/dealings/1/decryption-dealing.wire" \
              --decryption-dealing "$${DKG}/dealings/2/decryption-dealing.wire" \
              --decryption-dealing "$${DKG}/dealings/3/decryption-dealing.wire" \
              --context-dealing "$${DKG}/dealings/1/context-dealing.wire" \
              --context-dealing "$${DKG}/dealings/2/context-dealing.wire" \
              --context-dealing "$${DKG}/dealings/3/context-dealing.wire" \
              --transcript "$${DKG}/acceptances/1/transcript.toml" \
              --transcript-acceptance "$${DKG}/acceptances/1/transcript-acceptance.toml" \
              --transcript-acceptance "$${DKG}/acceptances/2/transcript-acceptance.toml" \
              --transcript-acceptance "$${DKG}/acceptances/3/transcript-acceptance.toml" \
              --output-directory "$${STORAGE_KEY}"

            VALIDATOR_PUBLIC_KEY=$$(miden-validator pubkey --signing-key.hex "$${SIGNING_KEY}")
            miden-validator dkg validate \
              --genesis /data/genesis/genesis.dat \
              --ceremony-directory "$${DKG}/ceremony" \
              --validator-public-key "$${VALIDATOR_PUBLIC_KEY}" \
              --bundle-directory "$${STORAGE_KEY}"
          done

          rm -rf "$${DKG}"
        fi

        touch /data/validators/.bootstrapped

  bootstrap-node:
    image: ${MIDEN_NODE_IMAGE:-miden-node}
    pull_policy: missing
    volumes:
      - node-data:/data
    entrypoint: ["/bin/sh", "-c"]
    depends_on:
      bootstrap-validator:
        condition: service_completed_successfully
    command:
      - |
        set -e
        if [ -f /data/node/.bootstrapped ]; then
          echo "Node already bootstrapped."
          exit 0
        fi

        echo "Cleaning incomplete node bootstrap state..."
        rm -rf /data/node
        mkdir -p /data/node

        echo "Bootstrapping node..."
        miden-node bootstrap \
          --data-directory /data/node \
          --genesis /data/genesis/genesis.dat

        touch /data/node/.bootstrapped

  bootstrap-ntx-builder:
    image: ${MIDEN_NTX_BUILDER_IMAGE:-miden-ntx-builder}
    pull_policy: missing
    volumes:
      - node-data:/data
    entrypoint: ["/bin/sh", "-c"]
    depends_on:
      bootstrap-node:
        condition: service_completed_successfully
    command:
      - |
        set -e
        if [ -f /data/ntx-builder/.bootstrapped ]; then
          echo "Network transaction builder already bootstrapped."
          exit 0
        fi

        echo "Cleaning incomplete network transaction builder bootstrap state..."
        rm -rf /data/ntx-builder
        mkdir -p /data/ntx-builder

        echo "Bootstrapping network transaction builder..."
        miden-ntx-builder bootstrap \
          --data-directory /data/ntx-builder \
          --genesis /data/genesis/genesis.dat

        touch /data/ntx-builder/.bootstrapped

configs:
  genesis:
    content: |
      timestamp = 1717344256
      version = 1

      [fee_parameters]
      verification_base_fee = 0
