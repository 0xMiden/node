services:
  monitor:
    profiles: [monitor]
    image: ${MIDEN_NETWORK_MONITOR_IMAGE:-miden-network-monitor}
    pull_policy: missing
    volumes:
      - node-data:/data:ro
    depends_on:
      funding-service:
        condition: service_started
      otel-collector:
        condition: service_started
      sequencer:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        exec miden-network-monitor start \
          --validator-signing-public-key="$$(cat /data/genesis/validator-signing-public-keys)"
    environment:
      MIDEN_MONITOR_RPC_URL: http://sequencer:57291
      # The monitor pays transaction fees from notes this service sends it. Only used on a chain
      # which charges fees.
      MIDEN_MONITOR_FUNDING_SERVICE_URL: http://funding-service:50401
      MIDEN_MONITOR_PORT: "3001"
      MIDEN_MONITOR_NETWORK_NAME: Localhost
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "127.0.0.1:3001:3001"
