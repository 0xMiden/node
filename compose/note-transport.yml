services:
  bootstrap-note-transport:
    profiles: [note-transport]
    image: ${MIDEN_NOTE_TRANSPORT_IMAGE:-miden-note-transport}
    pull_policy: missing
    command:
      - /bin/sh
      - -ec
      - |
        if [ ! -e /data/notes.sqlite3 ]; then
          miden-note-transport bootstrap --data-directory /data
        fi
    volumes:
      - note-transport-data:/data

  note-transport:
    profiles: [note-transport]
    image: ${MIDEN_NOTE_TRANSPORT_IMAGE:-miden-note-transport}
    pull_policy: missing
    command:
      - miden-note-transport
      - start
      - --enable-otel
    environment:
      MIDEN_NOTE_TRANSPORT_DATA_DIRECTORY: /data
      MIDEN_NOTE_TRANSPORT_LISTEN: 0.0.0.0:57292
      MIDEN_NOTE_TRANSPORT_MAX_STORAGE_BYTES: "1073741824"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=note-transport
    volumes:
      - note-transport-data:/data
    ports:
      - "127.0.0.1:57292:57292"
    depends_on:
      bootstrap-note-transport:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    restart: unless-stopped

volumes:
  note-transport-data:
