services:
  funding-service:
    image: ${MIDEN_FUNDING_SERVICE_IMAGE:-miden-funding-service}
    pull_policy: missing
    # The service reads its signing key and trusted validator set and opens its funding database.
    volumes:
      - node-data:/data
    depends_on:
      bootstrap-funding-service:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
      sequencer:
        condition: service_started
      tx-prover:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        exec miden-funding-service start \
          --data-directory=/data/funding-service \
          --listen=0.0.0.0:50401 \
          --rpc.url=http://sequencer:57291 \
          --tx-prover.url=${MIDEN_REMOTE_PROVER_URL:-http://tx-prover:50051} \
          --signing-key-file=/data/usdcx/distributor.secret \
          --validator-signing-public-key="$$(cat /data/validators/signing-public-keys)"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=funding-service
    ports:
      - "127.0.0.1:50401:50401"
    restart: unless-stopped
