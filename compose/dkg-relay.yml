services:
  dkg-relay:
    image: ${MIDEN_IROH_RELAY_IMAGE:-n0computer/iroh-relay:v1.3.0}
    pull_policy: missing
    command: ["--dev"]
    networks:
      - dkg

networks:
  # Keep the local ceremony and relay on an isolated Docker network.
  #
  # Development bootstrap must not depend on public relay or discovery services.
  dkg:
    internal: true
