[workspace]
members = [
  "bin/benchmark",
  "bin/large-account-benchmark",
  "bin/network-monitor",
  "bin/node",
  "bin/note-transport",
  "bin/ntx-builder",
  "bin/remote-prover",
  "bin/stress-test",
  "bin/validator",
  "crates/block-producer",
  "crates/db",
  "crates/grpc-error-macro",
  "crates/proto",
  "crates/rpc",
  "crates/store",
  "crates/test-macro",
  "crates/tracing",
  "crates/tracing-macro",
  "crates/utils",
  "proto",
  "xtask",
]

resolver = "2"

[workspace.package]
authors      = ["Miden contributors"]
edition      = "2024"
exclude      = [".github/"]
homepage     = "https://miden.xyz"
license      = "MIT"
readme       = "README.md"
repository   = "https://github.com/0xMiden/node"
rust-version = "1.98.1"
version      = "0.16.0-rc.5"

# Optimize the cryptography for faster tests involving account creation.
[profile.test.package.miden-crypto]
opt-level = 2

[profile.release]
debug = true

[workspace.dependencies]
# Workspace crates.
miden-node-block-producer   = { path = "crates/block-producer", version = "0.16.0-rc.5" }
miden-node-db               = { path = "crates/db", version = "0.16.0-rc.5" }
miden-node-grpc-error-macro = { path = "crates/grpc-error-macro", version = "0.16.0-rc.5" }
miden-node-proto            = { path = "crates/proto", version = "0.16.0-rc.5" }
miden-node-proto-build      = { path = "proto", version = "0.16.0-rc.5" }
miden-node-rpc              = { path = "crates/rpc", version = "0.16.0-rc.5" }
miden-node-store            = { path = "crates/store", version = "0.16.0-rc.5" }
miden-node-test-macro       = { path = "crates/test-macro" }
miden-node-tracing          = { path = "crates/tracing", version = "0.16.0-rc.5" }
miden-node-tracing-macro    = { path = "crates/tracing-macro", version = "0.16.0-rc.5" }
miden-node-utils            = { path = "crates/utils", version = "0.16.0-rc.5" }

# miden-protocol dependencies. These should be updated in sync.
miden-block-prover = { version = "=0.16.0-rc.9" }
miden-protocol     = { default-features = false, version = "=0.16.0-rc.9" }
miden-standards    = { version = "=0.16.0-rc.9" }
miden-testing      = { version = "=0.16.0-rc.9" }
miden-tx           = { default-features = false, version = "=0.16.0-rc.9" }
miden-tx-batch     = { version = "=0.16.0-rc.9" }

# Other miden dependencies. These should align with those expected by miden-protocol.
miden-crypto               = { version = "0.29.1" }
miden-note-transport-proto = { version = "0.5.0-rc.2" }

# External dependencies
anyhow             = { version = "1.0" }
arc-swap           = { version = "1.7" }
assert_matches     = { version = "1.5" }
axum               = { version = "0.8" }
backon             = { version = "1.6" }
build-rs           = { version = "0.3" }
chacha20poly1305   = { version = "0.11" }
clap               = { features = ["derive"], version = "4.5" }
codegen            = { version = "0.3" }
deadpool           = { default-features = false, version = "0.12" }
deadpool-diesel    = { version = "0.6" }
deadpool-sync      = { default-features = false, version = "0.1" }
diesel             = { version = "2.3" }
fs-err             = { version = "3" }
futures            = { version = "0.3" }
golden-core        = { version = "0.3.0" }
golden-ehtdh1      = { version = "0.3.0" }
golden-evrf        = { features = ["halo2curves-secp256k1"], version = "0.3.0" }
golden-halo2curves = { features = ["halo2curves-secp256k1"], version = "0.3.0" }
hex                = { version = "0.4" }
http               = { version = "1.3" }
humantime          = { version = "2.2" }
indexmap           = { version = "2.12" }
itertools          = { version = "0.14" }
libsqlite3-sys     = { features = ["bundled"], version = "0.35" }
lru                = { default-features = false, version = "0.18" }
miette             = { version = "7.6" }
opentelemetry      = { version = "0.31" }
pretty_assertions  = { version = "1.4" }
proc-macro2        = { version = "1.0" }
# prost and protox are from different authors and are _not_ released in
# lockstep, nor are they adhering to semver semantics. We keep this
# to avoid future breakage.
prost              = { default-features = false, version = "=0.14.3" }
prost-types        = { default-features = false, version = "=0.14.3" }
protox             = { version = "=0.9.1" }
quote              = { version = "1.0" }
rand               = { version = "0.10" }
rand_chacha        = { default-features = false, version = "0.10" }
rand_chacha_03     = { package = "rand_chacha", version = "0.3" }
rand_core_06       = { features = ["getrandom"], package = "rand_core", version = "0.6" }
rayon              = { version = "1.10" }
reqwest            = { version = "0.13" }
rstest             = { version = "0.26" }
rusqlite           = { features = ["array", "bundled"], version = "0.37" }
semver             = { version = "1.0" }
serde              = { features = ["derive"], version = "1" }
serial_test        = { version = "3.2" }
sha2               = { version = "0.10" }
syn                = { version = "2.0" }
tempfile           = { version = "3.12" }
thiserror          = { default-features = false, version = "2.0" }
thread-priority    = { version = "3.1" }
tokio              = { default-features = false, version = "1.46" }
tokio-stream       = { version = "0.1" }
tokio-util         = { features = ["rt"], version = "0.7" }
toml               = { version = "1.0" }
tonic              = { default-features = false, version = "0.14" }
tonic-health       = { version = "0.14" }
tonic-prost        = { version = "0.14" }
tonic-prost-build  = { version = "0.14" }
tonic-reflection   = { version = "0.14" }
tonic-web          = { version = "0.14" }
tower              = { version = "0.5" }
tower-http         = { features = ["cors", "trace"], version = "0.6" }
tower_governor     = { version = "0.8" }
tracing            = { version = "0.1" }
tracing-subscriber = { features = ["env-filter", "fmt", "json"], version = "0.3" }
trybuild           = { version = "1.0" }
url                = { features = ["serde"], version = "2.5" }
zeroize            = { version = "1.8" }

[workspace.metadata.cargo-shear]
# libsqlite3-sys is kept to control the bundled SQLite linkage.
# tonic-prost is used by generated gRPC code rather than handwritten Rust.
ignored = ["libsqlite3-sys", "tonic-prost"]

# Lints are set to warn for development, which are promoted to errors in CI.
[workspace.lints.clippy]
# Pedantic lints are set to a lower priority which allows lints in the group to be selectively enabled.
pedantic = { level = "warn", priority = -1 }

allow_attributes            = "deny"
cast_possible_truncation    = "allow" # Overly many instances especially regarding indices.
collapsible-if              = "allow" # Too new to enforce.
ignored_unit_patterns       = "allow" # Stylistic choice.
large_types_passed_by_value = "allow" # Triggered by BlockHeader being Copy + 334 bytes.
missing_errors_doc          = "allow" # TODO: fixup and enable this.
missing_panics_doc          = "allow" # TODO: fixup and enable this.
module_name_repetitions     = "allow" # Many triggers, and is a stylistic choice.
must_use_candidate          = "allow" # This marks many fn's which isn't helpful.
needless_for_each           = "allow" # Context dependent if that's useful.
should_panic_without_expect = "allow" # We don't care about the specific panic message.
# End of pedantic lints.

# Configure `cargo-typos`
[workspace.metadata.typos]
files.extend-exclude = [
  "*.min.js",             # Minified JS bundles (vendored htmx etc.).
  "*.svg",                # SVG files.
  "benchmark-proofs/",    # miden-benchmark output.
  "logs/",                # Native benchmark process logs.
  "node-data*/",          # Native benchmark runtime data dir + any sibling clones (RocksDB LOGs etc.).
  "snapshots/",           # Snapshot tarballs used by the bench replay workflow.
  "stress-test-store-*/", # Stress-test RocksDB stores (generated LOGs contain non-word tokens).
]
