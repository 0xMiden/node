name: Docker

# Builds and validates all Docker images and the Compose application. CI calls it
# in dry-run mode. Release and manually dispatched publish runs validate before
# publishing to GHCR.

on:
  workflow_call:
    inputs:
      mode:
        description: "Mode: dry-run or publish"
        required: false
        type: string
        default: dry-run
      ref:
        description: "Full Git commit SHA, tag name, or branch name to build"
        required: true
        type: string
      created:
        description: "OCI image creation timestamp; generated when omitted"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      mode:
        description: "Validate only, or validate and publish"
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - publish
      ref:
        description: "Full Git commit SHA, tag name, or branch name to publish"
        required: true
        type: string

concurrency:
  group: "${{ github.workflow }} @ docker @ ${{ inputs.mode == 'publish' && inputs.ref || github.sha }}"
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  REGISTRY_PREFIX: ghcr.io/0xmiden
  DOCKER_PLATFORMS: linux/amd64,linux/arm64
  MIDEN_FAUCET_IMAGE: ghcr.io/0xmiden/miden-faucet:v0.16.0-rc.1

jobs:
  preflight:
    name: Validate Docker inputs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
      created: ${{ steps.metadata.outputs.created }}
      images: ${{ steps.images.outputs.images }}
      immutable_tag: ${{ steps.metadata.outputs.immutable_tag }}
      mode: ${{ steps.inputs.outputs.mode }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - name: Validate inputs
        id: inputs
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_REF: ${{ inputs.ref }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          mode="${INPUT_MODE}"
          if [[ -z "${INPUT_REF}" ]]; then
            echo "::error::A Git commit, tag, or branch is required"
            exit 1
          fi

          case "${mode}" in
            dry-run | publish) ;;
            *)
              echo "::error::Unsupported Docker mode: ${mode}"
              exit 1
              ;;
          esac

          if [[ "${mode}" == "publish" && "${REPOSITORY_OWNER}" != "0xMiden" ]]; then
            echo "::error::Docker publication is restricted to the 0xMiden repository"
            exit 1
          fi

          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"

      - name: Define image matrix
        id: images
        run: |
          images="$(
            jq -cn '
              [
                {"component":"node",               "bin":"miden-node",            "port":57291, "target":"runtime"},
                {"component":"validator",          "bin":"miden-validator",       "port":50101, "target":"runtime"},
                {"component":"ntx-builder",        "bin":"miden-ntx-builder",     "port":50301, "target":"runtime"},
                {"component":"remote-prover",      "bin":"miden-remote-prover",   "port":50051, "target":"runtime"},
                {"component":"network-monitor",    "bin":"miden-network-monitor", "port":3000,  "target":"runtime"},
                {"component":"funding-service",    "bin":"miden-funding-service", "port":50401, "target":"runtime"},
                {"component":"node-tps-benchmark", "bin":"miden-benchmark",                     "target":"runtime-tool"}
              ]
            '
          )"
          echo "images=${images}" >> "${GITHUB_OUTPUT}"

      - name: Checkout repository
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve ref and prepare metadata
        id: metadata
        env:
          CHECKED_OUT_COMMIT: ${{ steps.checkout.outputs.commit }}
          CREATED: ${{ inputs.created }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail

          actual_commit="${CHECKED_OUT_COMMIT}"
          current_branch="$(git branch --show-current)"
          ref="${INPUT_REF}"

          if [[ "${ref}" == "${actual_commit}" ]]; then
            ref_type=commit
            ref_name="sha-${actual_commit:0:12}"
          elif [[ -n "${current_branch}" && "${ref}" == "${current_branch}" ]]; then
            ref_type=branch
            ref_name="${ref}"
          elif git show-ref --verify --quiet "refs/tags/${ref}" &&
            [[ "$(git rev-parse "refs/tags/${ref}^{commit}")" == "${actual_commit}" ]]; then
            ref_type=tag
            ref_name="${ref}"
          else
            echo "::error::Input ${ref} does not match the checked-out commit, branch, or tag"
            exit 1
          fi

          if [[ "${ref_type}" != "commit" && ! "${ref_name}" =~ ^[0-9A-Za-z_][0-9A-Za-z_.-]{0,127}$ ]]; then
            echo "::error::Git ${ref_type} ${ref_name} is not a valid container tag"
            exit 1
          fi

          if [[ "${ref_type}" != "commit" && ( "${ref_name}" == "latest" || "${ref_name}" == sha-* ) ]]; then
            echo "::error::The latest and sha-* tag namespaces are reserved"
            exit 1
          fi

          created="${CREATED}"
          if [[ -z "${created}" ]]; then
            created="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          fi

          {
            echo "commit=${actual_commit}"
            echo "created=${created}"
            echo "immutable_tag=sha-${actual_commit:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "tag=${ref_name}"
          } >> "${GITHUB_OUTPUT}"

  build-binaries:
    name: Build binaries (${{ matrix.platform }})
    needs: preflight
    runs-on: warp-ubuntu-latest-x64-8x
    permissions:
      contents: read
      # WarpBuild uses OIDC to authenticate its remote builder.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            architecture: amd64
          - platform: linux/arm64
            architecture: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false

      - name: Build binaries
        uses: WarpBuilds/build-push-action@ec038a9f4b87a7c7ccb50ac7a26a90d46a610a81 # v6.0.9
        with:
          context: .
          push: false
          file: ./Dockerfile
          target: build-report
          platforms: ${{ matrix.platform }}
          profile-name: ${{ vars.WARPBUILD_DOCKER_BUILDER_PROFILE }}
          pull: true
          outputs: type=local,dest=${{ runner.temp }}/kache-report

      - name: Upload Kache cache report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kache-report-${{ matrix.architecture }}
          path: ${{ runner.temp }}/kache-report/kache-report.md
          if-no-files-found: error
          retention-days: 1

  kache-summary:
    name: Summarize Kache cache
    needs: build-binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Download amd64 Kache cache report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kache-report-amd64
          path: ${{ runner.temp }}/kache-reports/amd64

      - name: Download arm64 Kache cache report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kache-report-arm64
          path: ${{ runner.temp }}/kache-reports/arm64

      - name: Add Kache cache summary
        run: |
          {
            echo "<details>"
            echo "<summary>Docker Kache stats</summary>"
            echo
            for architecture in amd64 arm64; do
              echo "<details>"
              printf '<summary><code>linux/%s</code></summary>\n\n' "${architecture}"
              cat "${RUNNER_TEMP}/kache-reports/${architecture}/kache-report.md"
              echo
              echo "</details>"
              echo
            done
            echo "</details>"
          } >> "${GITHUB_STEP_SUMMARY}"

  dry-run-docker:
    name: Validate ${{ matrix.component }} image
    needs: [preflight, build-binaries]
    runs-on: warp-ubuntu-latest-x64-8x
    permissions:
      contents: read
      # WarpBuild uses OIDC to authenticate its remote builder.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.preflight.outputs.images) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false

      - name: Validate Docker image
        uses: WarpBuilds/build-push-action@ec038a9f4b87a7c7ccb50ac7a26a90d46a610a81 # v6.0.9
        with:
          context: .
          push: false
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ env.DOCKER_PLATFORMS }}
          profile-name: ${{ vars.WARPBUILD_DOCKER_BUILDER_PROFILE }}
          pull: true
          build-args: |
            BIN=${{ matrix.bin }}
            PORT=${{ matrix.port }}
            CREATED=${{ needs.preflight.outputs.created }}
            VERSION=${{ needs.preflight.outputs.tag }}
            COMMIT=${{ needs.preflight.outputs.commit }}

  dry-run-compose:
    name: Dry-run docker compose publishing
    needs: preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false

      - name: Dry-run Compose publishing
        # Pin independently so the checked-out caller-provided ref cannot replace this action's code.
        uses: 0xMiden/node/.github/actions/publish-compose@3df9adbec870c8039d38cc946b2dc79ec9cf7e59
        env:
          MIDEN_NODE_IMAGE: ${{ env.REGISTRY_PREFIX }}/miden-node:${{ needs.preflight.outputs.tag }}
          MIDEN_VALIDATOR_IMAGE: ${{ env.REGISTRY_PREFIX }}/miden-validator:${{ needs.preflight.outputs.tag }}
          MIDEN_NTX_BUILDER_IMAGE: ${{ env.REGISTRY_PREFIX }}/miden-ntx-builder:${{ needs.preflight.outputs.tag }}
          MIDEN_REMOTE_PROVER_IMAGE: ${{ env.REGISTRY_PREFIX }}/miden-remote-prover:${{ needs.preflight.outputs.tag }}
          MIDEN_NETWORK_MONITOR_IMAGE:
            ${{ env.REGISTRY_PREFIX }}/miden-network-monitor:${{ needs.preflight.outputs.tag }}
          MIDEN_FUNDING_SERVICE_IMAGE:
            ${{ env.REGISTRY_PREFIX }}/miden-funding-service:${{ needs.preflight.outputs.tag }}
          MIDEN_BENCHMARK_IMAGE: ${{ env.REGISTRY_PREFIX }}/miden-node-tps-benchmark:${{ needs.preflight.outputs.tag }}
        with:
          compose-file: docker-compose.yml
          mode: dry-run
          package: miden-local-network
          registry-prefix: ${{ env.REGISTRY_PREFIX }}
          tag: ${{ needs.preflight.outputs.tag }}

  publish-docker:
    name: Publish ${{ matrix.component }}
    needs: [preflight, dry-run-docker, dry-run-compose]
    if: ${{ needs.preflight.outputs.mode == 'publish' }}
    runs-on: warp-ubuntu-latest-x64-8x
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.preflight.outputs.images) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false

      - name: Log in to the Container registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push Docker image
        uses: WarpBuilds/build-push-action@ec038a9f4b87a7c7ccb50ac7a26a90d46a610a81 # v6.0.9
        with:
          context: .
          push: true
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ env.DOCKER_PLATFORMS }}
          profile-name: ${{ vars.WARPBUILD_DOCKER_BUILDER_PROFILE }}
          pull: false
          build-args: |
            BIN=${{ matrix.bin }}
            PORT=${{ matrix.port }}
            CREATED=${{ needs.preflight.outputs.created }}
            VERSION=${{ needs.preflight.outputs.tag }}
            COMMIT=${{ needs.preflight.outputs.commit }}
          tags: |
            ${{ env.REGISTRY_PREFIX }}/miden-${{ matrix.component }}:${{ needs.preflight.outputs.tag }}
            ${{ env.REGISTRY_PREFIX }}/miden-${{ matrix.component }}:${{ needs.preflight.outputs.immutable_tag }}

  publish-compose:
    name: Publish Compose
    needs: [preflight, publish-docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false

      - name: Log in to the Container registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish Compose application
        # Pin independently so the checked-out caller-provided ref cannot replace this action's code.
        uses: 0xMiden/node/.github/actions/publish-compose@3df9adbec870c8039d38cc946b2dc79ec9cf7e59
        env:
          MIDEN_NODE_IMAGE: ${{ env.REGISTRY_PREFIX }}/miden-node:${{ needs.preflight.outputs.immutable_tag }}
          MIDEN_VALIDATOR_IMAGE: ${{ env.REGISTRY_PREFIX }}/miden-validator:${{ needs.preflight.outputs.immutable_tag }}
          MIDEN_NTX_BUILDER_IMAGE:
            ${{ env.REGISTRY_PREFIX }}/miden-ntx-builder:${{ needs.preflight.outputs.immutable_tag }}
          MIDEN_REMOTE_PROVER_IMAGE:
            ${{ env.REGISTRY_PREFIX }}/miden-remote-prover:${{ needs.preflight.outputs.immutable_tag }}
          MIDEN_NETWORK_MONITOR_IMAGE:
            ${{ env.REGISTRY_PREFIX }}/miden-network-monitor:${{ needs.preflight.outputs.immutable_tag }}
          MIDEN_FUNDING_SERVICE_IMAGE:
            ${{ env.REGISTRY_PREFIX }}/miden-funding-service:${{ needs.preflight.outputs.immutable_tag }}
          MIDEN_BENCHMARK_IMAGE:
            ${{ env.REGISTRY_PREFIX }}/miden-node-tps-benchmark:${{ needs.preflight.outputs.immutable_tag }}
        with:
          compose-file: docker-compose.yml
          mode: publish
          package: miden-local-network
          registry-prefix: ${{ env.REGISTRY_PREFIX }}
          tag: ${{ needs.preflight.outputs.tag }}
