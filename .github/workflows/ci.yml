name: Tests with a GitHub warm cache

on:
  push:
    branches: [bench/github-warm-kache-tests]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  KACHE_CI_BUNDLES: "false"
  KACHE_MAX_SIZE: 50GiB
  KACHE_CACHE_EXECUTABLES: "1"
  KACHE_REMOTE_READONLY: "true"
  KACHE_MANIFEST_KEY: node-tests-Linux-X64
  KACHE_NAMESPACE: node-tests-Linux-X64
  KACHE_MIN_COMPILE_MS: "1000"
  AWS_EC2_METADATA_DISABLED: "true"

jobs:
  seed:
    name: Seed target-branch snapshot
    runs-on: warp-ubuntu-latest-x64-8x
    timeout-minutes: 30
    env:
      TRIAL_MODE: seed
    steps: &tests
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 4
      - uses: $/.github/actions/cleanup-runner
        if: env.TRIAL_MODE == 'fork'
      - name: Select source revision
        run: |
          cp scripts/trial-cdn-meter.cjs "$RUNNER_TEMP/"
          if [[ "$TRIAL_MODE" == seed ]]; then
            git switch --detach cb8b4612279487322290fab551d8692fc9030090
          else
            git switch --detach 18a18e2462cb7fccbaeff67cf721f3ee551aecf9
          fi
          test ! -e target
          store="$(dirname "$GITHUB_WORKSPACE")/.tests-kache"
          test ! -e "$store"
          echo "KACHE_CACHE_DIR=$store" >> "$GITHUB_ENV"
          echo "KACHE_RUNTIME_DIR=$RUNNER_TEMP/tests-runtime" >> "$GITHUB_ENV"
      - name: Install toolchain
        run: rustup toolchain install --no-self-update
      - uses: taiki-e/install-action@v2.90.3
        with:
          tool: nextest@0.9.122
      - name: Install cache binary
        run: |
          install -d "$RUNNER_TEMP/tests-bin"
          file=kache-v2.0.0-rc.2-miden.3-x86_64-unknown-linux-gnu.tar.gz
          cd "$RUNNER_TEMP/tests-bin"
          curl -fsSL --retry 3 -O "https://github.com/Mirko-von-Leipzig/kache/releases/download/miden-kache-v2.0.0-rc.2-cloudfront.2/$file"
          echo "7afef202644a2b4dd7fed9e8f568fd381dfb8958da457ceb832d8a189eb0ad4f  $file" | sha256sum -c -
          tar xzf "$file" kache kache-engine
          echo "$PWD" >> "$GITHUB_PATH"
          echo "RUSTC_WRAPPER=$PWD/kache" >> "$GITHUB_ENV"
      - name: Restore GitHub snapshot
        if: env.TRIAL_MODE == 'warm' || env.TRIAL_MODE == 'fork'
        id: snapshot
        uses: actions/cache/restore@v5.0.3
        with:
          key: gh-warm-tests-v1-${{ github.run_id }}
          path: |
            ../.tests-kache/index.db*
            ../.tests-kache/store
          fail-on-cache-miss: true
      - name: Configure local and remote cache
        env:
          CDN_URL: ${{ vars.KACHE_DOWNLOAD_ENDPOINT }}
          REMOTE_BUCKET: ${{ vars.KACHE_S3_BUCKET }}
          REMOTE_REGION: ${{ vars.KACHE_S3_REGION }}
        run: |
          install -d -m 700 "$KACHE_RUNTIME_DIR"
          config="$RUNNER_TEMP/tests-config.toml"
          echo "KACHE_CONFIG=$config" >> "$GITHUB_ENV"
          if [[ "$TRIAL_MODE" == warm || "$TRIAL_MODE" == fork ]]; then
            test -s "$KACHE_CACHE_DIR/index.db"
          fi
          if [[ "$TRIAL_MODE" == fork ]]; then
            printf '[cache]\nlocal_only = true\n' > "$config"
          else
            test -n "$CDN_URL" && test -n "$REMOTE_BUCKET" && test -n "$REMOTE_REGION"
            nohup node "$RUNNER_TEMP/trial-cdn-meter.cjs" > "$RUNNER_TEMP/meter.log" 2>&1 </dev/null &
            for _ in {1..50}; do
              if curl -fsS http://127.0.0.1:18459/stats > /dev/null 2>&1; then break; fi
              sleep .1
            done
            curl -fsS http://127.0.0.1:18459/stats
            cat > "$config" <<TOML
          [cache]
          remote_readonly = true
          [cache.remote]
          type = "s3"
          bucket = "$REMOTE_BUCKET"
          region = "$REMOTE_REGION"
          prefix = "protected-branch"
          download_endpoint = "http://127.0.0.1:18458"
          endpoint = "http://127.0.0.1:18459"
          TOML
          fi
          KACHE_CONFIG="$config" kache daemon start
          df -h "$GITHUB_WORKSPACE"
      - name: Build tests
        run: cargo nextest run --all-features --workspace --no-run
      - name: Run tests
        run: cargo nextest run --all-features --workspace
      - name: Doc tests
        run: cargo test --doc --workspace --all-features
      - name: Measure requests and store
        if: always() && env.KACHE_CONFIG != ''
        run: |
          kache stats --full --format json --output "$RUNNER_TEMP/tests-report.json"
          kache daemon stop
          jq '{cache:.summary | {hit_rate_pct,local_hits,remote_hits,prefetch_hits,misses}, blob_bytes:.storage.blob_bytes}' "$RUNNER_TEMP/tests-report.json"
          df -h "$GITHUB_WORKSPACE"
          if [[ "$TRIAL_MODE" != fork ]]; then
            curl -fsS http://127.0.0.1:18459/stats | tee "$RUNNER_TEMP/counts.json"
            jq -e '.originAttempts == 0 and .unconfirmedResponses == 0' "$RUNNER_TEMP/counts.json" > /dev/null
            if [[ "$TRIAL_MODE" == cold || "$TRIAL_MODE" == seed ]]; then jq -e ".confirmed > 0" "$RUNNER_TEMP/counts.json" > /dev/null; fi
          fi
      - name: Save GitHub snapshot
        if: success() && env.TRIAL_MODE == 'seed'
        uses: actions/cache/save@v5.0.3
        with:
          key: gh-warm-tests-v1-${{ github.run_id }}
          path: |
            ../.tests-kache/index.db*
            ../.tests-kache/store

  compare:
    name: ${{ matrix.mode }} / ${{ matrix.runner }}
    needs: seed
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mode: cold, runner: warp-ubuntu-latest-x64-8x, timeout: 30}
          - {mode: warm, runner: warp-ubuntu-latest-x64-8x, timeout: 30}
          - {mode: fork, runner: ubuntu-24.04, timeout: 90}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      TRIAL_MODE: ${{ matrix.mode }}
    steps: *tests
