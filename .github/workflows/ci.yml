name: Docker amd64 with upstream kache on R2
on:
  push:
    branches: [bench/r2-kache-docker]
permissions:
  contents: read

env:
  R2_ENDPOINT: ${{ vars.KACHE_R2_ENDPOINT }}
  R2_PREFIX: trials/node-docker-amd64/${{ github.run_id }}
  AWS_EC2_METADATA_DISABLED: "true"
  AWS_DEFAULT_REGION: auto
  DOCKER_BUILD_SUMMARY: "false"
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  seed:
    name: Seed R2 from the base revision
    runs-on: warp-ubuntu-latest-x64-8x
    timeout-minutes: 120
    env:
      TRIAL_MODE: seed
    steps: &benchmark
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 8
          persist-credentials: false
      - name: Select source and verify endpoint
        run: |
          [[ "$R2_ENDPOINT" =~ ^https://[a-fA-F0-9]{32}(\.(eu|fedramp))?\.r2\.cloudflarestorage\.com/?$ ]]
          if [[ "$TRIAL_MODE" == seed ]]; then
            git switch --detach cb8b4612279487322290fab551d8692fc9030090
          else
            git switch --detach 18a18e2462cb7fccbaeff67cf721f3ee551aecf9
          fi
          test ! -e target
          {
            echo "SOURCE_COMMIT=$(git rev-parse HEAD)"
            echo "SOURCE_DATE=$(git log -1 --format=%cI)"
          } >> "$GITHUB_ENV"
      - name: Verify empty R2 prefix
        if: env.TRIAL_MODE == 'seed'
        env: &credentials
          AWS_ACCESS_KEY_ID: ${{ secrets.KACHE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.KACHE_R2_SECRET_ACCESS_KEY }}
        run: |
          count=$(aws --endpoint-url "$R2_ENDPOINT" s3api list-objects-v2 --bucket kache-trial \
            --prefix "$R2_PREFIX/" --max-keys 1 --no-paginate --query KeyCount --output text)
          [[ "$count" == 0 ]]
      - name: Build Docker compilation environment
        run: docker build --target build-base --tag node-ci-build-env .
      - name: Install upstream kache and configure R2
        run: |
          arch=x86_64-unknown-linux-musl
          archive="kache-$arch.tar.gz"
          mkdir -p "$RUNNER_TEMP/upstream" "$RUNNER_TEMP/bin" "$RUNNER_TEMP/docker-binaries/app/bin" target/docker-trial
          cd "$RUNNER_TEMP/upstream"
          curl --fail --silent --show-error --location --retry 3 -O "https://github.com/kunobi-ninja/kache/releases/download/v2.2.0/$archive"
          echo "eeb6e72b9f55d0e9d61cae0789ffa8f3ab8c33bef166b7af655cc0806447ebac  $archive" | sha256sum -c -
          tar -xzf "$archive"
          for binary in kache kache-engine; do
            install -m 0755 "$(find . -type f -name "$binary" -print -quit)" "$RUNNER_TEMP/bin/$binary"
          done
          "$RUNNER_TEMP/bin/kache" --version
          readonly=true
          if [[ "$TRIAL_MODE" == seed ]]; then readonly=false; fi
          cat > "$RUNNER_TEMP/remote.toml" <<TOML
          [cache]
          remote_readonly = $readonly
          [cache.remote]
          type = "s3"
          bucket = "kache-trial"
          region = "auto"
          endpoint = "${R2_ENDPOINT%/}"
          prefix = "$R2_PREFIX"
          TOML
      - name: Compile Docker release binaries
        env: *credentials
        run: |
          writable=false
          if [[ "$TRIAL_MODE" == seed ]]; then writable=true; fi
          docker run --rm \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/app,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/target/docker-trial,dst=/tmp" \
            --mount "type=bind,src=$RUNNER_TEMP/docker-binaries,dst=/output" \
            --mount "type=bind,src=$RUNNER_TEMP/bin/kache,dst=/usr/local/bin/kache,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/bin/kache-engine,dst=/usr/local/bin/kache-engine,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/remote.toml,dst=/run/remote.toml,readonly" \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_EC2_METADATA_DISABLED \
            -e CARGO_TARGET_DIR=/tmp/target -e OUTPUT_DIR=/output/app/bin \
            -e CACHE_WRITABLE="$writable" -e KACHE_MIN_COMPILE_MS=1000 \
            -e KACHE_MANIFEST_KEY=node-docker-amd64 -e KACHE_NAMESPACE=node-docker-amd64 \
            node-ci-build-env bash .github/actions/build-docker-binaries/compile.sh
      - name: Report artifact transfers and verify cache reuse
        if: always()
        run: |
          report="$RUNNER_TEMP/docker-binaries/report.json"
          jq -c '{summary:(.summary | {hit_rate_pct,local_hits,prefetch_hits,remote_hits,misses}),network:(.network | {bytes_up,bytes_down,uploads_ok,uploads_failed,downloads_ok,downloads_failed,total_get_requests}),store_bytes:.storage.blob_bytes}' "$report" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ "$TRIAL_MODE" == seed ]]; then
            jq -e '.network.uploads_ok > 0' "$report" > /dev/null
          else
            jq -e '(.summary.remote_hits + .summary.prefetch_hits > 0) and (.network.total_get_requests > 0)' "$report" > /dev/null
          fi
      - name: Set up Docker builder
        uses: docker/setup-buildx-action@v4.4.1
        with:
          cache-binary: false
      - name: Validate Docker images
        uses: docker/bake-action@v7.5.0
        with:
          source: .
          files: ./docker-bake.hcl
          targets: validate
          push: false
          pull: true
          set: |
            *.contexts.builder=${{ runner.temp }}/docker-binaries
            *.platform=linux/amd64
            *.args.CREATED=${{ env.SOURCE_DATE }}
            *.args.VERSION=sha-${{ env.SOURCE_COMMIT }}
            *.args.COMMIT=${{ env.SOURCE_COMMIT }}

  read:
    name: Read R2 on fresh runner ${{ matrix.replica }}
    needs: seed
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    runs-on: warp-ubuntu-latest-x64-8x
    timeout-minutes: 120
    env:
      TRIAL_MODE: read
    steps: *benchmark

  cleanup:
    name: Measure and remove trial objects
    needs: [seed, read]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Inventory and clean the run prefix
        env: *credentials
        run: |
          [[ "$R2_ENDPOINT" =~ ^https://[a-fA-F0-9]{32}(\.(eu|fedramp))?\.r2\.cloudflarestorage\.com/?$ ]]
          [[ "$R2_PREFIX" =~ ^trials/node-docker-amd64/[0-9]+$ ]]
          inventory() {
            aws --endpoint-url "$R2_ENDPOINT" s3api list-objects-v2 --bucket kache-trial --prefix "$R2_PREFIX/" \
              --query 'Contents[].Size' --output json | jq -c '(. // []) | {objects:length,bytes:(add // 0)}'
          }
          inventory | tee -a "$GITHUB_STEP_SUMMARY"
          aws --endpoint-url "$R2_ENDPOINT" s3 rm "s3://kache-trial/$R2_PREFIX/" --recursive --only-show-errors
          remaining=$(inventory)
          echo "After cleanup: $remaining"
          jq -e '.objects == 0' <<< "$remaining"
