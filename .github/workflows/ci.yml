# Continuous integration jobs.
# Fork pull requests use GitHub-hosted runners without kache. Internal builds use
# WarpBuild runners and share Rust artifacts when the S3 cache is configured.
name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  merge_group:
  push:
    branches:
      - next
      - "release/v*"
    paths-ignore:
      - "**.txt"
  pull_request:
    paths-ignore:
      - "**.txt"

env:
  USE_CACHE: >-
    ${{
      github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
    }}
  # Only protected-branch pushes save the separate xtask binary cache.
  SAVE_CACHE: ${{ github.event_name == 'push' }}
  # Reduce cache usage by removing debug information.
  CARGO_PROFILE_DEV_DEBUG: 0

# Limits workflow concurrency to only the latest commit in the PR.
concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  # ===============================================================================================
  # Conventional builds, lints and tests
  # ===============================================================================================

  # Normal cargo build that verifies the workspace compiles.
  build:
    permissions:
      contents: read
      id-token: write
    runs-on: >-
      ${{
        (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) &&
        'warp-ubuntu-latest-x64-8x' || 'ubuntu-24.04'
      }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/cleanup-runner
        if: env.USE_CACHE != 'true'
      - uses: $/.github/actions/install-rocksdb
      - uses: $/.github/actions/install-protobuf-compiler
      - name: Rustup
        run: rustup toolchain install --no-self-update
      - uses: $/.github/actions/setup-kache
      - name: cargo build
        run: cargo build --workspace --all-targets --locked
      - name: Check static linkage
        run: |
          # Ensure database libraries are statically linked to avoid system library dependencies
          #
          # It explodes our possible dependency matrix when debugging, particularly
          # in the case of sqlite and rocksdb as embedded databases, we want them
          # shipped in identical versions we test with. Those are notoriously difficult
          # to compile time configure and OSes make very opinionated choices.
          metadata=$(cargo metadata --no-deps --format-version 1)
          mapfile -t bin_targets < <(
            echo "${metadata}" | jq -r '.packages[].targets[] | select(.kind[] == "bin") | .name' | sort -u
          )
          if [[ ${#bin_targets[@]} -eq 0 ]]; then
            echo "error: No binary targets found in cargo manifest."
            exit 1
          fi
          for bin_target in "${bin_targets[@]}"; do
            # Ensure the binary was built by the previous step.
            binary_path="target/debug/${bin_target}"
            if ! [[ -x "${binary_path}" ]]; then
              echo "error: Missing binary or missing executable bit: ${binary_path}";
              exit 2;
            fi
            # ldd exits non-zero for static binaries, so we inspect its output instead.
            # if ldd fails we use an empty string instead
            ldd_output="$(ldd "${binary_path}" 2>&1 || true)"
            if echo "${ldd_output}" | grep -E -q 'not a dynamic executable'; then
              continue
            fi
            # librocksdb/libsqlite entries indicate dynamic linkage (bad).
            if echo "${ldd_output}" | grep -E -q 'librocksdb|libsqlite'; then
              echo "error: Dynamic linkage detected for ${bin_target}."
              echo "${ldd_output}"
              exit 3
            fi
          done
          printf "Static linkage check passed for all of %s\n" "${bin_targets[*]}"

      - uses: $/.github/actions/report-kache
        if: ${{ !cancelled() && env.KACHE_RUNTIME_DIR != '' }}
        with:
          diagnostics: "true"

  docker:
    name: Docker dry-run
    permissions:
      # Reusable-workflow permission ceiling; dry-run jobs do not receive these writes.
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: $/.github/workflows/docker.yml
    with:
      mode: dry-run
      ref: ${{ github.sha }}

  clippy:
    name: lint - clippy
    permissions:
      contents: read
      id-token: write
    runs-on: >-
      ${{
        (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) &&
        'warp-ubuntu-latest-x64-8x' || 'ubuntu-24.04'
      }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/cleanup-runner
        if: env.USE_CACHE != 'true'
      - name: Rustup
        run: rustup toolchain install --no-self-update
      - uses: $/.github/actions/setup-kache
      - name: clippy
        run: cargo clippy --locked --all-targets --all-features --workspace -- -D warnings
      - uses: $/.github/actions/report-kache
        if: ${{ !cancelled() && env.KACHE_RUNTIME_DIR != '' }}

  tests:
    permissions:
      contents: read
      id-token: write
    runs-on: >-
      ${{
        (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) &&
        'warp-ubuntu-latest-x64-8x' || 'ubuntu-24.04'
      }}
    timeout-minutes: >-
      ${{
        (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) && 30 || 90
      }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/cleanup-runner
        if: env.USE_CACHE != 'true'
      - name: Verify protected branch ruleset target
        uses: $/.github/actions/verify-ruleset-target
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          ruleset-name: "Protected branches"
          expected-patterns: '["next", "release/v*"]'
      - name: Rustup
        run: rustup toolchain install --no-self-update
      - uses: taiki-e/install-action@v2.87.29
        with:
          tool: nextest@0.9.122
      - uses: $/.github/actions/setup-kache
      - name: Build tests
        run: cargo nextest run --all-features --workspace --no-run
      - name: Run tests
        run: cargo nextest run --all-features --workspace
      - name: Doc tests
        run: cargo test --doc --workspace --all-features
      - uses: $/.github/actions/report-kache
        if: ${{ !cancelled() && env.KACHE_RUNTIME_DIR != '' }}

  doc:
    permissions:
      contents: read
      id-token: write
    runs-on: >-
      ${{
        (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) &&
        'warp-ubuntu-latest-x64-8x' || 'ubuntu-24.04'
      }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/cleanup-runner
        if: env.USE_CACHE != 'true'
      - name: Rustup
        run: rustup toolchain install --no-self-update
      - uses: $/.github/actions/setup-kache
      - name: Build docs
        run: cargo doc --no-deps --workspace --all-features --locked
      - uses: $/.github/actions/report-kache
        if: ${{ !cancelled() && env.KACHE_RUNTIME_DIR != '' }}

  # Node.js jobs use Ubuntu's updated CA bundle for HTTPS connections.
  #
  # Node.js 22.18.0's bundled roots still trust the compromised eMudhra intermediates.
  # Each job updates and verifies Ubuntu's CA package before running Node.js actions,
  # then uses --use-openssl-ca to replace Node.js's bundled roots for Node.js and npm.
  # See https://emudhra.we-have-a-problem.com/.
  external-docs:
    name: docs - external
    runs-on: ubuntu-24.04
    env:
      # Use the updated system CA bundle for Node.js and npm HTTPS connections.
      NODE_OPTIONS: --use-openssl-ca
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      # Docusaurus checks for package updates during builds and may try to write to a user config
      # directory. Disable that notifier in CI so docs output is limited to build/link failures.
      NO_UPDATE_NOTIFIER: "1"
    steps:
      - name: Update CA certificates
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ca-certificates
          dpkg --compare-versions "$(dpkg-query -W -f='${Version}' ca-certificates)" \
            ge 20260816ubuntu0.24.04.1
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22.18.0"
          package-manager-cache: false
      - name: Install dependencies
        working-directory: ./docs/external
        run: npm ci
      - name: Build documentation and check links
        working-directory: ./docs/external
        run: npm run build:dev

  # Ensure the stress-test still functions by running some cheap benchmarks.
  stress-test:
    name: stress test
    permissions:
      contents: read
      id-token: write
    runs-on: >-
      ${{
        (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) &&
        'warp-ubuntu-latest-x64-8x' || 'ubuntu-24.04'
      }}
    timeout-minutes: >-
      ${{
        (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) && 20 || 90
      }}
    env:
      DATA_DIR: /tmp/store
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/cleanup-runner
        if: env.USE_CACHE != 'true'
      - name: Rustup
        run: rustup toolchain install --no-self-update
      - uses: $/.github/actions/setup-kache
      - uses: taiki-e/install-action@v2.87.29
        with:
          tool: nextest@0.9.122
      - name: Build
        run: cargo build --bin miden-node-stress-test --locked
      - name: Create store directory
        run: mkdir -p ${{ env.DATA_DIR }}
      - name: Seed the store
        run: |
          cargo run --bin miden-node-stress-test seed-store \
            --data-directory ${{ env.DATA_DIR }} \
            --num-accounts 500 --public-accounts-percentage 50
  # TODO re-introduce
      # - name: Benchmark state sync
        # run: |
          # cargo run --bin miden-node-stress-test benchmark-store \
            # --data-directory ${{ env.DATA_DIR }} \
            # --iterations 10 --concurrency 1 sync-state
      - name: Benchmark notes sync
        run: |
          cargo run --bin miden-node-stress-test benchmark-store \
            --data-directory ${{ env.DATA_DIR }} \
            --iterations 10 --concurrency 1 sync-notes
      - name: Benchmakr nullifiers sync
        run: |
          cargo run --bin miden-node-stress-test benchmark-store \
            --data-directory ${{ env.DATA_DIR }} \
            --iterations 10 --concurrency 1 sync-nullifiers --prefixes 10
      - uses: $/.github/actions/report-kache
        if: ${{ !cancelled() && env.KACHE_RUNTIME_DIR != '' }}

  # Smoke-tests `miden-benchmark` end-to-end against a locally bootstrapped node.
  benchmark:
    name: benchmark smoke
    env:
      # Retains source locations in backtraces for the smoke-test binaries.
      #
      # Full variable/type debug information makes cached executables exceed
      # 1 GiB each and adds substantial transfer and restore work to this job.
      CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
    permissions:
      contents: read
      id-token: write
    runs-on: >-
      ${{
        (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) &&
        'warp-ubuntu-latest-x64-8x' || 'ubuntu-24.04'
      }}
    timeout-minutes: >-
      ${{
        (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) && 20 || 90
      }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/cleanup-runner
        if: env.USE_CACHE != 'true'
      - name: Rustup
        run: rustup toolchain install --no-self-update
      - uses: $/.github/actions/setup-kache
      - name: Build benchmark stack
        run: |
          cargo build --release --locked \
            --bin miden-node \
            --bin miden-validator \
            --bin miden-ntx-builder \
            --bin miden-remote-prover \
            --bin miden-benchmark \
            --bin miden-usdcx-genesis
      - name: Run benchmark with N=5
        env:
          N_TXS: "5"
          USE_REMOTE_PROVER: "0"
          WAIT_BLOCKS: "30"
          RUN_DIR: ${{ runner.temp }}/bench-local-run
          MIDEN_VALIDATOR_STORAGE_KEY_FILE: >-
            ${{ github.workspace }}/scripts/testdata/insecure-storage-key/validator-1/storage-key.bundle
        run: |
          export PATH="$PWD/target/release:$PATH"
          ./scripts/bench-local.sh
      - uses: $/.github/actions/report-kache
        if: ${{ !cancelled() && env.KACHE_RUNTIME_DIR != '' }}
        with:
          diagnostics: "true"
      - name: Dump component logs on failure
        if: failure()
        run: |
          set +e
          for f in ${{ runner.temp }}/bench-local-run/logs/*.log; do
            [ -f "$f" ] || continue
            echo "::group::$(basename "$f")"
            tail -n 200 "$f"
            echo "::endgroup::"
          done

  # Collects Rust cache reports in one workflow summary.
  #
  # Reports from earlier attempts remain useful when only some jobs are rerun;
  # each row identifies the attempt that produced its latest available report.
  kache-summary:
    name: Rust cache summary
    needs: [build, clippy, tests, doc, stress-test, benchmark]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: kache-performance-*
          path: ${{ runner.temp }}/kache-reports
      - name: Summarize Rust cache
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          report_root="${RUNNER_TEMP}/kache-reports"
          mkdir -p "${report_root}"
          details="$(mktemp "${RUNNER_TEMP}/kache-details.XXXXXX")"
          {
            echo '## Rust compiler cache'
            echo
            echo '| Job | Result | Attempt | Hit rate | Hits | Misses | Downloaded | Uploaded |'
            echo '| --- | --- | ---: | ---: | ---: | ---: | ---: | ---: |'
            for job in build clippy tests doc stress-test benchmark; do
              result="$(jq -r --arg job "${job}" '.[$job].result' <<< "${JOB_RESULTS}")"
              directory="$(find "${report_root}" -mindepth 1 -maxdepth 1 -type d \
                -name "kache-performance-${job}-*" | sort -V | tail -n 1)"
              if [[ ! -f "${directory}/report.json" ]]; then
                printf '| %s | %s; report unavailable | — | — | — | — | — | — |\n' "${job}" "${result}"
                continue
              fi
              attempt="${directory##*-}"
              jq -r --arg job "${job}" --arg result "${result}" --arg attempt "${attempt}" '
                def size:
                  if . >= 1073741824 then ((. / 1073741824 * 100 | round) / 100 | tostring) + " GiB"
                  else ((. / 1048576 * 100 | round) / 100 | tostring) + " MiB" end;
                .summary as $s | .network as $n |
                ($s.local_hits + $s.prefetch_hits + $s.remote_hits) as $hits |
                [$job, $result, $attempt,
                 (if $s.total_crates > 0 then ($s.hit_rate_pct | tostring) + "%" else "—" end),
                 $hits, $s.misses, ($n.bytes_down | size), ($n.bytes_up | size)] |
                "| " + (map(tostring) | join(" | ")) + " |"
              ' "${directory}/report.json"
              if [[ -f "${directory}/report.md" ]]; then
                {
                  printf '\n<details>\n<summary>%s — attempt %s</summary>\n\n' "${job}" "${attempt}"
                  cat "${directory}/report.md"
                  printf '\n</details>\n'
                } >> "${details}"
              fi
            done
            echo
            echo 'Each row uses the latest available report for that job in this run.'
            echo 'Transfer counts exclude any uploads completed during post-job finalization.'
            cat "${details}"
          } >> "${GITHUB_STEP_SUMMARY}"

  # ===============================================================================================
  # Jobs that don't require caching to be efficient
  # ===============================================================================================

  rust-versions:
    name: lint - Rust versions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/check-rust-versions

  audit:
    name: lint - dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2.87.29
        with:
          tool: cargo-binstall@1.25.3
      - name: Install cargo-audit
        run: cargo binstall --locked --no-confirm cargo-audit@0.22.2
      - name: Check xtask dependencies
        run: cargo audit --file xtask/Cargo.lock --deny yanked --deny unsound
      - name: Check dependencies
        run: |
          set +e
          # Ignore RUSTSEC-2024-0388 because only inactive ruint compatibility features use derivative.
          # Ignore RUSTSEC-2024-0436 because upstream crates do not provide releases without paste.
          cargo audit --color always \
            --deny yanked \
            --deny unsound \
            --ignore RUSTSEC-2024-0388 \
            --ignore RUSTSEC-2024-0436 2>&1 \
            | tee "${RUNNER_TEMP}/cargo-audit.ansi"
          audit_status=${PIPESTATUS[0]}
          set -e

          sed $'s/\033\\[[0-9;]*m//g' "${RUNNER_TEMP}/cargo-audit.ansi" \
            > "${RUNNER_TEMP}/cargo-audit.txt"

          has_unmaintained=false
          if grep -Eqi "Warning:[[:space:]]+unmaintained" "${RUNNER_TEMP}/cargo-audit.txt"; then
            has_unmaintained=true
          fi

          {
            echo "## Dependency audit"
            echo

            if (( audit_status != 0 )); then
              echo "> [!CAUTION]"
              echo "> The dependency audit failed. Review the report below."
            elif [[ "${has_unmaintained}" == true ]]; then
              echo "> [!WARNING]"
              echo "> The audit passed, but it found unmaintained dependencies."
            else
              echo "> [!TIP]"
              echo "> The dependency audit passed."
            fi

            echo
            echo "<details>"
            echo "<summary>Full cargo-audit report</summary>"
            echo
            echo '```console'
            cat "${RUNNER_TEMP}/cargo-audit.txt"
            echo '```'
            echo "</details>"
          } >> "${GITHUB_STEP_SUMMARY}"

          exit "${audit_status}"

  actions-security:
    name: lint - gh actions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Update CA certificates
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ca-certificates
          dpkg --compare-versions "$(dpkg-query -W -f='${Version}' ca-certificates)" \
            ge 20260816ubuntu0.24.04.1
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          mkdir -p "${RUNNER_TEMP}/actionlint"
          cd "${RUNNER_TEMP}/actionlint"
          release_url=https://github.com/rhysd/actionlint/releases/download/v1.7.12
          curl --fail --location --retry 3 \
            "${release_url}/actionlint_1.7.12_linux_amd64.tar.gz" --output actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint

      # Checks workflow syntax, expressions, and embedded shell scripts.
      - name: actionlint
        run: '"${RUNNER_TEMP}/actionlint/actionlint" -pyflakes='

      # Limits workflow and local action YAML lines to 120 characters.
      - name: yamllint
        run: |
          python3 -m venv "${RUNNER_TEMP}/yamllint"
          "${RUNNER_TEMP}/yamllint/bin/python" - <<'PY'
          import subprocess
          import sys
          from importlib.metadata import version
          from pip._vendor.packaging.version import Version

          # Bootstrap pip using Ubuntu's patched CA bundle.
          #
          # Venvs can start with an older pip. Disable additive truststore loading
          # where supported so the upgrade cannot use pip's old bundled roots.
          if Version(version("pip")) < Version("26.2.2"):
              tls_options = ["--cert", "/etc/ssl/certs/ca-certificates.crt"]
              if Version(version("pip")) >= Version("24.2"):
                  tls_options.append("--use-deprecated=legacy-certs")
              subprocess.run(
                  [sys.executable, "-m", "pip", "install", "--disable-pip-version-check",
                   "--upgrade", *tls_options, "pip>=26.2.2"],
                  check=True,
              )

          pip_version = version("pip")
          if Version(pip_version) < Version("26.2.2"):
              raise SystemExit(f"pip >= 26.2.2 is required for the updated CA bundle; found {pip_version}")
          PY
          "${RUNNER_TEMP}/yamllint/bin/pip" install --disable-pip-version-check yamllint==1.38.0
          "${RUNNER_TEMP}/yamllint/bin/yamllint" -c .config/yamllint.yml .github/workflows .github/actions

      # Requires complete lockfile coverage and validates pinned commits and
      # repository identities against GitHub.
      - name: Verify action dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.2.0
          gh actions-lock --verify

      # Checks workflows and local actions for unsafe permissions, script
      # injection, credential exposure, and unpinned container images.
      - name: zizmor
        uses: zizmorcore/zizmor-action@v0.7.1
        with:
          advanced-security: false
          config: .config/zizmor.yml
          version: 1.31.0

  typos:
    name: lint - spelling
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # Use the updated system CA bundle for Node.js and npm HTTPS connections.
      NODE_OPTIONS: --use-openssl-ca
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    steps:
      - name: Update CA certificates
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ca-certificates
          dpkg --compare-versions "$(dpkg-query -W -f='${Version}' ca-certificates)" \
            ge 20260816ubuntu0.24.04.1
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22.18.0"
          package-manager-cache: false
      - uses: taiki-e/install-action@v2.87.29
        with:
          tool: typos@1.42.0
      - name: Install Markdown tools
        run: make install-markdown-tools
      - run: make typos-check
      - run: make markdown-spellcheck

  fmt:
    name: lint - formatting
    runs-on: ubuntu-24.04
    env:
      # Use the updated system CA bundle for Node.js and npm HTTPS connections.
      NODE_OPTIONS: --use-openssl-ca
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    steps:
      - name: Update CA certificates
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ca-certificates
          dpkg --compare-versions "$(dpkg-query -W -f='${Version}' ca-certificates)" \
            ge 20260816ubuntu0.24.04.1
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-xtask
        with:
          save-cache: ${{ env.SAVE_CACHE }}
      - name: Rustup +nightly
        run: rustup toolchain install --no-self-update nightly --component rustfmt
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22.18.0"
          package-manager-cache: false
      - name: Install Markdown tools
        run: make install-markdown-tools
      - name: Fmt
        run: make format-check XTASK=xtask
      - name: Markdown lint
        run: make markdown-lint

  toml:
    name: lint - toml fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2.87.29
        with:
          tool: taplo-cli@0.10.0
      - run: make toml-check

  workspace-lints:
    name: lint - workspace toml
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2.87.29
        with:
          tool: cargo-workspace-lints@0.1.4
      - run: make workspace-check

  workspace-inheritance:
    name: lint - workspace inheritance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2.87.29
        with:
          tool: cargo-binstall@1.25.3
      - name: Install workspace inheritance checker
        run: cargo binstall --locked --no-confirm cargo-workspace-inheritance-check@1.3.0
      - name: Check workspace inheritance
        run: cargo workspace-inheritance-check --promotion-threshold 2 --promotion-failure

  unused_deps:
    name: lint - unused deps
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2.87.29
        with:
          tool: cargo-binstall@1.25.3
      - name: Install cargo-shear
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall --locked --no-confirm cargo-shear@1.12.4
      - name: Check for unused dependencies
        run: make shear
