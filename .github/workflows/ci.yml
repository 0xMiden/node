name: Docker amd64 with a Warp warm cache

on:
  push:
    branches: [bench/warp-warm-kache-docker]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_BUILD_SUMMARY: "false"
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  KACHE_CI_BUNDLES: "false"
  KACHE_MAX_SIZE: 50GiB
  KACHE_CACHE_EXECUTABLES: "1"
  KACHE_REMOTE_READONLY: "true"
  KACHE_MANIFEST_KEY: node-docker-amd64
  KACHE_NAMESPACE: node-docker-amd64
  KACHE_MIN_COMPILE_MS: "1000"
  AWS_EC2_METADATA_DISABLED: "true"

jobs:
  seed:
    name: Seed target-branch snapshot
    runs-on: warp-ubuntu-latest-x64-8x
    timeout-minutes: 120
    env:
      TRIAL_MODE: seed
    steps: &docker
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 8
      - name: Select source revision
        run: |
          cp scripts/trial-cdn-meter.cjs "$RUNNER_TEMP/"
          if [[ "$TRIAL_MODE" == seed ]]; then
            git switch --detach cb8b4612279487322290fab551d8692fc9030090
          else
            git switch --detach 18a18e2462cb7fccbaeff67cf721f3ee551aecf9
          fi
          test ! -e target
          store="$GITHUB_WORKSPACE/target/docker-trial/kache-cache"
          test ! -e "$store"
          {
            echo "KACHE_CACHE_DIR=$store"
            echo "SOURCE_COMMIT=$(git rev-parse HEAD)"
            echo "SOURCE_DATE=$(git log -1 --format=%cI)"
          } >> "$GITHUB_ENV"
      - name: Build Docker compilation environment
        run: docker build --target build-base --tag node-ci-build-env .
      - name: Install cache binary
        run: |
          install -d "$RUNNER_TEMP/docker-trial-bin"
          file=kache-v2.0.0-rc.2-miden.3-x86_64-unknown-linux-gnu.tar.gz
          cd "$RUNNER_TEMP/docker-trial-bin"
          curl -fsSL --retry 3 -O "https://github.com/Mirko-von-Leipzig/kache/releases/download/miden-kache-v2.0.0-rc.2-cloudfront.2/$file"
          echo "7afef202644a2b4dd7fed9e8f568fd381dfb8958da457ceb832d8a189eb0ad4f  $file" | sha256sum -c -
          tar xzf "$file" kache kache-engine
          echo "CACHE_BINARY_DIR=$PWD" >> "$GITHUB_ENV"
      - name: Restore Warp snapshot
        if: env.TRIAL_MODE == 'warm'
        id: snapshot
        uses: WarpBuilds/cache/restore@v2.0.0
        with:
          key: warp-warm-docker-amd64-v1-${{ github.run_id }}
          path: |
            target/docker-trial/kache-cache/index.db*
            target/docker-trial/kache-cache/store
          fail-on-cache-miss: true
      - name: Configure local and remote cache
        env:
          CDN_URL: ${{ vars.KACHE_DOWNLOAD_ENDPOINT }}
          REMOTE_BUCKET: ${{ vars.KACHE_S3_BUCKET }}
          REMOTE_REGION: ${{ vars.KACHE_S3_REGION }}
        run: |
          mkdir -p "$KACHE_CACHE_DIR" "$RUNNER_TEMP/docker-binaries/app/bin"
          config="$RUNNER_TEMP/docker-trial-config.toml"
          echo "KACHE_CONFIG=$config" >> "$GITHUB_ENV"
          if [[ "$TRIAL_MODE" == warm ]]; then
            test -s "$KACHE_CACHE_DIR/index.db"
          fi
          test -n "$CDN_URL" && test -n "$REMOTE_BUCKET" && test -n "$REMOTE_REGION"
          nohup node "$RUNNER_TEMP/trial-cdn-meter.cjs" > "$RUNNER_TEMP/meter.log" 2>&1 </dev/null &
          for _ in {1..50}; do
            if curl -fsS http://127.0.0.1:18459/stats > /dev/null 2>&1; then break; fi
            sleep .1
          done
          curl -fsS http://127.0.0.1:18459/stats
          cat > "$config" <<TOML
          [cache]
          remote_readonly = true
          [cache.remote]
          type = "s3"
          bucket = "$REMOTE_BUCKET"
          region = "$REMOTE_REGION"
          prefix = "protected-branch"
          download_endpoint = "http://127.0.0.1:18458"
          endpoint = "http://127.0.0.1:18459"
          TOML
          df -h "$GITHUB_WORKSPACE"
      - name: Compile Docker release binaries
        run: |
          docker run --rm --network host \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/app,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/target/docker-trial,dst=/tmp" \
            --mount "type=bind,src=$RUNNER_TEMP/docker-binaries,dst=/output" \
            --mount "type=bind,src=$CACHE_BINARY_DIR/kache,dst=/usr/local/bin/kache,readonly" \
            --mount "type=bind,src=$CACHE_BINARY_DIR/kache-engine,dst=/usr/local/bin/kache-engine,readonly" \
            --mount "type=bind,src=$KACHE_CONFIG,dst=/run/remote.toml,readonly" \
            -e CARGO_TARGET_DIR=/tmp/target -e OUTPUT_DIR=/output/app/bin \
            -e CACHE_WRITABLE=false -e KACHE_CI_BUNDLES -e KACHE_REMOTE_READONLY \
            -e KACHE_MANIFEST_KEY -e KACHE_NAMESPACE -e AWS_EC2_METADATA_DISABLED \
            -e GITHUB_ACTIONS -e GITHUB_EVENT_NAME -e GITHUB_REF_TYPE -e GITHUB_REF_PROTECTED \
            node-ci-build-env bash .github/actions/build-docker-binaries/compile.sh
      - name: Measure requests and store
        if: always() && env.KACHE_CONFIG != ''
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$KACHE_CACHE_DIR"
          jq '{cache:.summary | {hit_rate_pct,local_hits,remote_hits,prefetch_hits,misses}, blob_bytes:.storage.blob_bytes}' "$RUNNER_TEMP/docker-binaries/report.json"
          df -h "$GITHUB_WORKSPACE"
          curl -fsS http://127.0.0.1:18459/stats | tee "$RUNNER_TEMP/counts.json"
          jq -e '.originAttempts == 0 and .unconfirmedResponses == 0' "$RUNNER_TEMP/counts.json" > /dev/null
          if [[ "$TRIAL_MODE" == cold || "$TRIAL_MODE" == seed ]]; then jq -e ".confirmed > 0" "$RUNNER_TEMP/counts.json" > /dev/null; fi
      - name: Set up Docker builder
        uses: docker/setup-buildx-action@v4.4.1
        with:
          cache-binary: false
      - name: Validate Docker images
        uses: docker/bake-action@v7.5.0
        with:
          source: .
          files: ./docker-bake.hcl
          targets: validate
          push: false
          pull: true
          set: |
            *.contexts.builder=${{ runner.temp }}/docker-binaries
            *.platform=linux/amd64
            *.args.CREATED=${{ env.SOURCE_DATE }}
            *.args.VERSION=sha-${{ env.SOURCE_COMMIT }}
            *.args.COMMIT=${{ env.SOURCE_COMMIT }}
      - name: Save Warp snapshot
        if: success() && env.TRIAL_MODE == 'seed'
        uses: WarpBuilds/cache/save@v2.0.0
        with:
          key: warp-warm-docker-amd64-v1-${{ github.run_id }}
          path: |
            target/docker-trial/kache-cache/index.db*
            target/docker-trial/kache-cache/store
      - name: Verify published Warp snapshot
        if: success() && env.TRIAL_MODE == 'seed'
        uses: WarpBuilds/cache/restore@v2.0.0
        with:
          key: warp-warm-docker-amd64-v1-${{ github.run_id }}
          path: |
            target/docker-trial/kache-cache/index.db*
            target/docker-trial/kache-cache/store
          lookup-only: true
          fail-on-cache-miss: true

  compare:
    name: Docker amd64 / ${{ matrix.sample }}
    needs: seed
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mode: cold, sample: cold}
          - {mode: warm, sample: warm-1}
          - {mode: warm, sample: warm-2}
    runs-on: warp-ubuntu-latest-x64-8x
    timeout-minutes: 120
    env:
      TRIAL_MODE: ${{ matrix.mode }}
    steps: *docker
