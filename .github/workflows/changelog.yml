# Runs changelog related jobs.
# CI job heavily inspired by: https://github.com/tarides/changelog-check-action

name: changelog

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

env:
  SAVE_CACHE: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  changelog:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-xtask
        with:
          save-cache: ${{ env.SAVE_CACHE }}
      - name: Verify changelog metadata
        run: |
          set -euo pipefail

          jq -r '.pull_request.body // ""' "${GITHUB_EVENT_PATH}" > "${RUNNER_TEMP}/pr-body.md"
          xtask changelog verify --pr-body-file "${RUNNER_TEMP}/pr-body.md"
        shell: bash
