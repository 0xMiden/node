name: Reset Docker Builder Cache

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  reset-cache:
    name: Reset WarpBuild cache
    runs-on: warp-ubuntu-latest-x64-8x
    if: ${{ github.repository_owner == '0xMiden' }}
    steps:
      - name: Validate builder profile
        env:
          WARPBUILD_PROFILE: ${{ vars.WARPBUILD_DOCKER_BUILDER_PROFILE }}
        run: |
          set -euo pipefail

          if [[ -z "${WARPBUILD_PROFILE}" ]]; then
            echo "::error::WARPBUILD_DOCKER_BUILDER_PROFILE is not configured"
            exit 1
          fi

      - name: Configure WarpBuild Docker builders
        uses: WarpBuilds/docker-configure@v1.1.7
        with:
          profile-name: ${{ vars.WARPBUILD_DOCKER_BUILDER_PROFILE }}

      - name: Show cache usage
        run: docker buildx du

      - name: Clear cache
        run: docker buildx prune --all --force
