# Checks that run once per day.
#
# These are generally expensive jobs that don't provide enough utility to run on _every_ PR.
name: nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # Everyday at 06:00am UTC

permissions:
  contents: read

jobs:
  docker:
    name: Docker dry-run (${{ matrix.branch }})
    strategy:
      fail-fast: false
      matrix:
        branch: [next, release/v0.18]
    permissions:
      # The reusable workflow declares these permissions for its publication jobs.
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: $/.github/workflows/docker.yml
    secrets:
      KACHE_R2_ACCESS_KEY_ID: ${{ secrets.KACHE_R2_ACCESS_KEY_ID }}
      KACHE_R2_SECRET_ACCESS_KEY: ${{ secrets.KACHE_R2_SECRET_ACCESS_KEY }}
    with:
      mode: dry-run
      ref: ${{ matrix.branch }}

  # Run tests on the beta channel to provide feedback for Rust team.
  beta-test:
    name: test on beta channel
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: "next"
          persist-credentials: false
      - name: Cleanup large tools for build space
        uses: $/.github/actions/cleanup-runner
      - uses: $/.github/actions/install-rocksdb
      - uses: $/.github/actions/install-protobuf-compiler
      - name: Rustup
        run: rustup install beta && rustup default beta
      - uses: taiki-e/install-action@v2.90.5
        with:
          tool: nextest@0.9.122
      - name: Run tests
        run: make test

  # Check all feature combinations work individually.
  #
  # This check is too expensive to run on every PR, both in terms of CPU and cache size.
  check-features:
    name: feature combinations
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: "next"
          persist-credentials: false
      - name: Cleanup large tools for build space
        uses: $/.github/actions/cleanup-runner
      - uses: $/.github/actions/install-rocksdb
      - uses: $/.github/actions/install-protobuf-compiler
      - name: Install rust
        run: rustup toolchain install --no-self-update
      - name: Install cargo-hack
        uses: taiki-e/install-action@v2.90.5
        with:
          tool: cargo-hack@0.6.45
      - name: Check all feature combinations
        run: make check-features
