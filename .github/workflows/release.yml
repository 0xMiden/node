name: Release

on:
  push:
    tags:
      # We can only apply a basic filter here, the proper filter is implemented in
      # the tag ruleset "Release tags". We avoid duplicating that here and instead
      # check the ruleset gate in a dedicated step below.
      #
      # This prevents drift between this workflow and the ruleset, as well as
      # problems with the patterns using different "regex-like" engines. The ruleset
      # remains the source of truth.
      - "v*"

concurrency:
  group: "${{ github.workflow }} @ ${{ github.ref }}"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      created: ${{ steps.release.outputs.created }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      workspace_packages: ${{ steps.release.outputs.workspace_packages }}
      publishable_crates: ${{ steps.release.outputs.publishable_crates }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      # GitHub enforces the tag restrictions. This only guards against the
      # workflow trigger and ruleset target drifting apart.
      - name: Verify release tag ruleset target
        uses: ./.github/actions/verify-ruleset-target
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          ruleset-name: "Release tags"
          expected-patterns: '["v*"]'

      - name: Rustup
        run: rustup toolchain install --no-self-update

      - name: Validate release version
        id: release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version="${TAG#v}"
          metadata="$(cargo metadata --no-deps --format-version 1)"
          mapfile -t versions < <(jq -r '[.packages[] | select(.publish != []) | .version] | unique | .[]' <<< "${metadata}")
          workspace_packages="$(
            jq -c '
              . as $m
              | ($m.workspace_root + "/") as $root
              | $m.workspace_members as $members
              | $m.packages
              | map(select(.id as $id | $members | index($id)))
              | map({ name, manifest_path: (.manifest_path | ltrimstr($root)) })
              | sort_by(.name)
            ' <<< "${metadata}"
          )"
          publishable_crates="$(
            jq -c '
              [.packages[] | select(.publish != []) | { name }]
              | sort_by(.name)
            ' <<< "${metadata}"
          )"

          if [[ "${#versions[@]}" -ne 1 ]]; then
            printf '%s\n' "${versions[@]}"
            echo "::error::Publishable workspace packages do not share exactly one version"
            exit 1
          fi

          if [[ "${versions[0]}" != "${version}" ]]; then
            echo "::error::Release tag ${TAG} does not match workspace package version ${versions[0]}"
            exit 1
          fi

          prerelease=false
          if [[ "${version}" == *-* ]]; then
            prerelease=true
          fi

          {
            # Keep Docker metadata identical between dry-run and publish builds so the
            # publish build can reuse the dry-run build cache instead of invalidating
            # the final image layers with a new timestamp.
            echo "commit=$(git rev-parse HEAD)"
            echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "tag=${TAG}"
            echo "version=${version}"
            echo "prerelease=${prerelease}"
            echo "workspace_packages=${workspace_packages}"
            echo "publishable_crates=${publishable_crates}"
          } >> "${GITHUB_OUTPUT}"

      - name: Ensure GitHub release does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            echo "::error::GitHub release ${TAG} already exists. Leaving the existing release and tag untouched."
            exit 1
          fi

  check-crate-builds:
    name: cargo check ${{ matrix.name }}
    runs-on: warp-ubuntu-latest-x64-8x
    needs: preflight
    if: ${{ github.repository_owner == '0xMiden' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.preflight.outputs.publishable_crates) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/install-rocksdb
      - uses: ./.github/actions/install-protobuf-compiler

      - name: Cleanup large tools for build space
        uses: ./.github/actions/cleanup-runner

      - name: Rustup
        run: rustup toolchain install --no-self-update

      - uses: WarpBuilds/rust-cache@9d0cc3090d9c87de74ea67617b246e978735b1a1 # v2.9.1
        with:
          shared-key: release-crate-${{ matrix.name }}
          cache-provider: warpbuild
          save-if: true

      - name: Check package builds
        env:
          PACKAGE: ${{ matrix.name }}
        run: cargo check -p "${PACKAGE}" --locked

  dry-run-crates:
    name: Dry-run crates.io publish
    runs-on: warp-ubuntu-latest-x64-8x
    needs: preflight
    if: ${{ github.repository_owner == '0xMiden' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Rustup
        run: rustup toolchain install --no-self-update

      - uses: WarpBuilds/rust-cache@9d0cc3090d9c87de74ea67617b246e978735b1a1 # v2.9.1
        with:
          shared-key: release-dry-run-crates
          cache-provider: warpbuild
          save-if: true

      - name: Dry-run cargo publish without verification
        run: cargo publish --workspace --dry-run --no-verify --locked

  check-msrv:
    name: Check MSRV ${{ matrix.name }}
    runs-on: warp-ubuntu-latest-x64-8x
    needs: preflight
    if: ${{ github.repository_owner == '0xMiden' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.preflight.outputs.workspace_packages) }}
    # Deliberately use stable Rust instead of rust-toolchain.toml because
    # cargo-msrv itself may require a newer compiler than the repo MSRV.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/install-rocksdb
      - uses: ./.github/actions/install-protobuf-compiler

      - name: Cleanup large tools for build space
        uses: ./.github/actions/cleanup-runner

      - name: Rustup
        run: rustup toolchain install --no-self-update stable

      - uses: WarpBuilds/rust-cache@9d0cc3090d9c87de74ea67617b246e978735b1a1 # v2.9.1
        with:
          shared-key: release-msrv-${{ matrix.name }}
          cache-provider: warpbuild
          save-if: true

      - name: Install cargo-binstall
        uses: taiki-e/install-action@055f5df8c3f65ea01cd41e9dc855becd88953486 # v2.75.18
        with:
          tool: cargo-binstall

      - name: Install cargo-msrv
        run: cargo binstall --no-confirm cargo-msrv

      - name: Show package info
        env:
          MANIFEST_PATH: ${{ matrix.manifest_path }}
          PACKAGE: ${{ matrix.name }}
        run: |
          echo "Package: ${PACKAGE}"
          echo "Manifest path: ${MANIFEST_PATH}"
          cargo msrv show --manifest-path "${MANIFEST_PATH}"

      - name: Check MSRV
        env:
          MANIFEST_PATH: ${{ matrix.manifest_path }}
        run: cargo msrv verify --manifest-path "${MANIFEST_PATH}"

  dry-run-docker:
    name: Dry-run Docker bundle
    needs: preflight
    if: ${{ github.repository_owner == '0xMiden' }}
    permissions:
      # Reusable-workflow permission ceiling; dry-run jobs do not receive these writes.
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      mode: dry-run
      ref: ${{ needs.preflight.outputs.tag }}
      created: ${{ needs.preflight.outputs.created }}

  publish-docker:
    name: Publish Docker bundle
    needs: [preflight, check-crate-builds, dry-run-crates, check-msrv, dry-run-docker]
    if: ${{ github.repository_owner == '0xMiden' }}
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    uses: ./.github/workflows/docker.yml
    with:
      mode: publish
      ref: ${{ needs.preflight.outputs.tag }}
      created: ${{ needs.preflight.outputs.created }}

  publish-github-release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    needs: [preflight, publish-docker]
    if: ${{ github.repository_owner == '0xMiden' }}
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Rustup
        run: rustup toolchain install --no-self-update

      - name: Re-check GitHub release absence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            echo "::error::GitHub release ${TAG} already exists. Leaving it untouched."
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail

          prerelease_flag=()
          if [[ "${PRERELEASE}" == "true" ]]; then
            prerelease_flag=(--prerelease)
          fi

          if ! cargo xtask changelog render \
            --release-tag "${TAG}" \
            > "${RUNNER_TEMP}/release-notes.md"; then
            echo "::warning title=Release notes generation failed::Using fallback release notes."
            printf 'Release %s\n\nRelease notes could not be generated automatically.\n' "${TAG}" \
              > "${RUNNER_TEMP}/release-notes.md"
          fi

          gh release create "${TAG}" \
            --repo "${REPO}" \
            --verify-tag \
            --title "${TAG}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            "${prerelease_flag[@]}"

      - name: Trigger crates.io publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail

          # GITHUB_TOKEN creates the release, so the release event does not start workflows.
          # Use workflow_dispatch to start crates.io publishing with GITHUB_TOKEN.
          gh workflow run publish-crates.yml \
            --repo "${REPO}" \
            --ref "${TAG}" \
            --field "version=${TAG}"
