name: "Setup xtask"
description: "Restore or build xtask on Linux and add it to PATH"

inputs:
  save-cache:
    description: "Save the binary after a cache miss"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Identify runner image
      id: image
      shell: bash
      run: |
        source /etc/os-release
        echo "id=${ID}-${VERSION_ID}" >> "${GITHUB_OUTPUT}"

    - name: Restore xtask
      id: cache
      uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      with:
        path: ${{ runner.temp }}/xtask-bin
        # Accept only an exact match because the binary runs without a Cargo build check.
        key: xtask-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.id }}-${{ hashFiles('xtask/**', '!xtask/target/**', 'rust-toolchain.toml', '.cargo/config.toml', '.config/clippy.toml', '.github/actions/setup-xtask/action.yml') }}

    - name: Rustup
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: rustup toolchain install --no-self-update

    - name: Test, lint, and build xtask
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        CARGO_PROFILE_DEV_DEBUG: "0"
      run: |
        cargo test --locked --manifest-path xtask/Cargo.toml --all-targets --all-features
        cargo clippy --locked --manifest-path xtask/Cargo.toml --all-targets --all-features -- -D warnings
        cargo build --locked --manifest-path xtask/Cargo.toml
        install -D xtask/target/debug/xtask "${RUNNER_TEMP}/xtask-bin/xtask"

    - name: Save xtask
      if: inputs.save-cache == 'true' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      with:
        path: ${{ runner.temp }}/xtask-bin
        key: ${{ steps.cache.outputs.cache-primary-key }}

    - name: Add xtask to PATH
      shell: bash
      # The runner controls this path. The directory contains only the xtask binary.
      run: echo "${RUNNER_TEMP}/xtask-bin" >> "${GITHUB_PATH}" # zizmor: ignore[github-env]
