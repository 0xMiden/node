name: Report kache performance
description: Add Rust cache statistics to the job summary

runs:
  using: composite
  steps:
    - name: Summarize compiler cache
      shell: bash
      run: |
        report="$(mktemp "${RUNNER_TEMP}/kache-report.XXXXXX")"
        kache stats --full --format github --output "${report}"
        cat "${report}" >> "${GITHUB_STEP_SUMMARY}"
        printf '\nTransfer counts exclude uploads completed during post-job finalization.\n' \
          >> "${GITHUB_STEP_SUMMARY}"
