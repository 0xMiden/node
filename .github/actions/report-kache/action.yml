name: Report kache performance
description: Collect Rust cache reports for the workflow summary

inputs:
  diagnostics:
    description: Include traces, daemon logs, and runner diagnostics
    default: "false"

runs:
  using: composite
  steps:
    # Captures reports before the setup action removes the kache runtime.
    #
    # Job artifacts let the final summary collect results after every build
    # finishes, with optional diagnostics for investigating slow restores.
    - name: Collect cache report
      shell: bash
      run: |
        report_dir="${RUNNER_TEMP}/kache-performance"
        mkdir -p "${report_dir}"
        kache stats --full --format json --output "${report_dir}/report.json"
        kache stats --full --format github --output "${report_dir}/report.md"

    - name: Collect cache diagnostics
      if: inputs.diagnostics == 'true'
      shell: bash
      env:
        KACHE_S3_BUCKET: ${{ vars.KACHE_S3_BUCKET }}
        KACHE_S3_REGION: ${{ vars.KACHE_S3_REGION }}
      run: |
        report_dir="${RUNNER_TEMP}/kache-performance"
        kache stats --full --format trace --output "${report_dir}/trace.json"
        kache daemon status --json > "${report_dir}/daemon-status.json"
        for log in "${KACHE_RUNTIME_DIR}"/*.log; do
          if [[ -f "${log}" ]]; then
            cp "${log}" "${report_dir}/"
          fi
        done
        {
          findmnt -T "${GITHUB_WORKSPACE}"
          findmnt -T "${KACHE_CACHE_DIR}"
          df -h "${GITHUB_WORKSPACE}" "${KACHE_CACHE_DIR}"
          timing='S3 endpoint: dns=%{time_namelookup}s connect=%{time_connect}s '
          timing+='tls=%{time_appconnect}s first_byte=%{time_starttransfer}s\n'
          if [[ -n "${KACHE_S3_BUCKET}" && -n "${KACHE_S3_REGION}" ]]; then
            for attempt in 1 2 3; do
              curl --head --silent --show-error --output /dev/null \
                --connect-timeout 5 --max-time 10 \
                --write-out "${timing}" \
                "https://${KACHE_S3_BUCKET}.s3.${KACHE_S3_REGION}.amazonaws.com/" \
                || printf 'S3 endpoint probe failed\n'
            done
          fi
        } > "${report_dir}/runner.txt"

    - name: Upload cache report
      uses: actions/upload-artifact@v7.0.2
      with:
        name: kache-performance-${{ github.job }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/kache-performance
        retention-days: 3
