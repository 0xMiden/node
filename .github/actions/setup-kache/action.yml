name: Setup kache
description: Configure Rust compiler caching for subsequent Cargo commands

inputs:
  prepare-only:
    description: Install kache and configure AWS access without starting a host daemon
    default: "false"
  s3-bucket:
    description: S3 bucket for shared compiler artifacts
    default: ""
  s3-region:
    description: AWS region of the cache bucket
    default: ""
  s3-role-arn:
    description: AWS role to assume for cache access
    default: ""

outputs:
  enabled:
    description: Whether shared cache access is configured
    value: ${{ steps.cache.outputs.remote }}
  binary:
    description: Installed kache executable for a container bind mount
    value: ${{ steps.install.outputs.binary }}
  config:
    description: Remote configuration file for a container bind mount
    value: ${{ steps.cache.outputs.config }}

runs:
  using: composite
  steps:
    # Configures the remote before the action starts the kache daemon.
    #
    # The daemon reads its remote from a file. PRs read both prefixes and publish
    # to prs; protected-branch pushes read and publish only protected-branch.
    - name: Configure cache
      id: cache
      shell: bash
      env:
        REMOTE_CACHE: >-
          ${{
            inputs.s3-bucket != '' &&
            inputs.s3-region != '' &&
            inputs.s3-role-arn != '' &&
            github.repository == '0xMiden/node' &&
            (github.event_name != 'pull_request' ||
              github.event.pull_request.head.repo.full_name == github.repository) &&
            github.event_name != 'pull_request_target' &&
            github.event_name != 'workflow_run' &&
            github.actor != 'dependabot[bot]' && github.actor != 'dependabot' &&
            github.actor != 'github-actions[bot]'
          }}
        KACHE_S3_BUCKET: ${{ inputs.s3-bucket }}
        KACHE_S3_REGION: ${{ inputs.s3-region }}
      # Only a runner-created temporary path is exported to the job environment.
      run: | # zizmor: ignore[github-env]
        echo "remote=${REMOTE_CACHE}" >> "${GITHUB_OUTPUT}"
        if [[ "${REMOTE_CACHE}" != true ]]; then
          exit 0
        fi
        config="$(mktemp "${RUNNER_TEMP}/kache-config.XXXXXX")"
        python3 - > "${config}" <<'PYTHON'
        import json
        import os

        print('[cache.remote]')
        for key, value in {
            "type": "s3",
            "bucket": os.environ["KACHE_S3_BUCKET"],
            "region": os.environ["KACHE_S3_REGION"],
            "prefix": "protected-branch",
            "pull_request_prefix": "prs",
        }.items():
            print(f"{key} = {json.dumps(value)}")
        PYTHON
        echo "KACHE_CONFIG=${config}" >> "${GITHUB_ENV}"
        echo "config=${config}" >> "${GITHUB_OUTPUT}"

    - name: Authenticate to the Rust cache
      if: steps.cache.outputs.remote == 'true'
      uses: aws-actions/configure-aws-credentials@v6.3.0
      with:
        role-to-assume: ${{ inputs.s3-role-arn }}
        aws-region: ${{ inputs.s3-region }}
        role-duration-seconds: 3600
        unset-current-credentials: true

    # Installs the v1.2.2 prefetch fix in the runner's tool cache.
    #
    # The upstream action reuses this verified binary while retaining its setup
    # and post-job hooks. Remove this step once an official release has the fix.
    - name: Install patched kache
      id: install
      if: steps.cache.outputs.remote == 'true'
      shell: bash
      env:
        TRIAL_RELEASE: https://github.com/Mirko-von-Leipzig/kache/releases/download/miden-kache-v1.2.2-prefetch.1
      run: |
        case "${RUNNER_OS}/${RUNNER_ARCH}" in
          Linux/X64)
            target=x86_64-unknown-linux-gnu
            architecture=x64
            checksum=8a221c37e8ceff15f7899c118f1c08b174ee13985b5bfa195fe4018156bebe07
            ;;
          Linux/ARM64)
            target=aarch64-unknown-linux-gnu
            architecture=arm64
            checksum=554678133cc146f4ac9a58c1a38e5aeba94d161b7b105c6c9aea73cd1e25b2c6
            ;;
          *) echo "Unsupported runner: ${RUNNER_OS}/${RUNNER_ARCH}" >&2; exit 1 ;;
        esac
        archive="$(mktemp "${RUNNER_TEMP}/kache-trial.XXXXXX")"
        curl --fail --location --silent --show-error --retry 3 \
          "${TRIAL_RELEASE}/kache-v1.2.2-miden.1-${target}.tar.gz" \
          --output "${archive}"
        printf '%s  %s\n' "${checksum}" "${archive}" | sha256sum --check --status
        tool_dir="${RUNNER_TOOL_CACHE}/kache/1.2.2-miden.1/${architecture}"
        mkdir -p "${tool_dir}"
        tar -xzf "${archive}" -C "${tool_dir}" kache
        "${tool_dir}/kache" --version
        touch "${tool_dir}.complete"
        echo "binary=${tool_dir}/kache" >> "${GITHUB_OUTPUT}"
        rm "${archive}"

    - name: Set up Rust compiler cache
      if: steps.cache.outputs.remote == 'true' && inputs.prepare-only != 'true'
      uses: kunobi-ninja/kache-action@v1
      with:
        version: v1.2.2-miden.1
        s3-bucket: ${{ inputs.s3-bucket }}
        s3-region: ${{ inputs.s3-region }}
        s3-prefix: protected-branch
        manifest-key: node-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
        max-size: 50GiB
        cache-executables: true
        github-cache: false
        save-cache: true
        sync: false
        pr-comment: false
        job-summary: false

    - name: Report cache configuration
      if: steps.cache.outputs.remote == 'true' && inputs.prepare-only != 'true'
      shell: bash
      run: kache doctor
