name: Setup kache
description: Configure Rust compiler caching for the company R2 bucket

inputs:
  prepare-only:
    description: Install kache for use inside the Docker build container
    default: "false"

outputs:
  writable:
    description: Whether this build publishes compiler artifacts
    value: ${{ steps.cache.outputs.writable }}

runs:
  using: composite
  steps:
    - name: Select R2 cache access
      id: cache
      if: >-
        env.KACHE_R2_ENDPOINT != '' && env.KACHE_S3_ACCESS_KEY != '' && env.KACHE_S3_SECRET_KEY != '' &&
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      shell: bash
      env:
        WRITABLE: >-
          ${{ github.event_name == 'pull_request' ||
              (inputs.prepare-only == 'true' && github.event_name == 'schedule' &&
              github.ref_protected && github.ref == 'refs/heads/next') ||
              (github.event_name == 'push' && github.ref_protected &&
              (github.ref == 'refs/heads/next' || startsWith(github.ref, 'refs/heads/release/v'))) }}
      run: |
        if [[ ! "${KACHE_R2_ENDPOINT}" =~ ^https://[[:alnum:].-]+\.r2\.cloudflarestorage\.com/?$ ]]; then
          echo "::error::KACHE_R2_ENDPOINT must be the account's R2 S3 API URL." >&2
          exit 1
        fi
        # Kache reads the protected prefix first and publishes PR entries under this shared prefix.
        echo "KACHE_PULL_REQUEST_PREFIX=artifacts-pr" >> "${GITHUB_ENV}"
        echo "writable=${WRITABLE}" >> "${GITHUB_OUTPUT}"

    # Docker starts its own daemon inside the build container.
    - name: Set up upstream kache
      if: steps.cache.outcome == 'success'
      uses: kunobi-ninja/kache-action@v1
      with:
        version: v2.3.0
        s3-bucket: ${{ inputs.prepare-only != 'true' && 'kache' || '' }}
        s3-region: auto
        s3-endpoint: ${{ env.KACHE_R2_ENDPOINT }}
        s3-access-key-id: ${{ inputs.prepare-only != 'true' && env.KACHE_S3_ACCESS_KEY || '' }}
        s3-secret-access-key: ${{ inputs.prepare-only != 'true' && env.KACHE_S3_SECRET_KEY || '' }}
        manifest-key: node-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
        max-size: 50GiB
        cache-executables: true
        github-cache: false
        save-cache: ${{ inputs.prepare-only != 'true' && steps.cache.outputs.writable == 'true' }}
        sync: false
        pr-comment: false
        job-summary: false

    - name: Report cache configuration
      if: inputs.prepare-only != 'true' && env.RUSTC_WRAPPER != ''
      shell: bash
      run: kache doctor

    - name: Configure Rust compiler wrapper
      if: inputs.prepare-only != 'true' && env.RUSTC_WRAPPER != ''
      shell: bash
      # The runner supplies GITHUB_ACTION_PATH for this action.
      run: echo "RUSTC_WRAPPER=${GITHUB_ACTION_PATH}/kache.sh" >> "${GITHUB_ENV}" # zizmor: ignore[github-env]
