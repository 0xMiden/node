name: Build Docker binaries
description: Compile release binaries in the Docker build environment with the shared S3 compiler cache
inputs:
  architecture:
    description: Native Docker architecture
    required: true
  s3-bucket:
    description: S3 bucket for compiler artifacts
    default: ""
  s3-region:
    description: AWS region of the cache bucket
    default: ""
  s3-role-arn:
    description: AWS role for the compiler cache
    default: ""
outputs:
  context:
    description: Directory replacing Docker's builder stage
    value: ${{ steps.build.outputs.context }}
runs:
  using: composite
  steps:
    - name: Build compilation environment
      shell: bash
      run: docker build --target build-base --tag node-ci-build-env .

    - name: Prepare compiler cache
      id: cache
      uses: $/.github/actions/setup-kache
      with:
        prepare-only: "true"
        s3-bucket: ${{ inputs.s3-bucket }}
        s3-region: ${{ inputs.s3-region }}
        s3-role-arn: ${{ inputs.s3-role-arn }}

    - name: Compile image binaries
      id: build
      shell: bash
      env:
        CACHE_ENABLED: ${{ steps.cache.outputs.enabled }}
        CACHE_BINARY: ${{ steps.cache.outputs.binary }}
        CACHE_CONFIG: ${{ steps.cache.outputs.config }}
        ARCHITECTURE: ${{ inputs.architecture }}
        ACTION_PATH: ${{ github.action_path }}
      run: bash "${ACTION_PATH}/run.sh"

    - name: Upload compiler cache report
      if: always()
      uses: actions/upload-artifact@v7.0.2
      with:
        name: kache-report-${{ inputs.architecture }}
        path: |
          ${{ runner.temp }}/docker-binaries/report.md
          ${{ runner.temp }}/docker-binaries/report.json
        if-no-files-found: warn
        retention-days: 1
