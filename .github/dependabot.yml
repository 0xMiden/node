version: 2

multi-ecosystem-groups:
  tooling:
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"

updates:
  - package-ecosystem: cargo
    directories:
      - /
      - /xtask
    target-branch: next
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: tooling
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /.config/markdown
    patterns: ["*"]
    multi-ecosystem-group: tooling
    cooldown:
      default-days: 7
