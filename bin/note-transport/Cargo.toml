[package]
authors.workspace      = true
description            = "Miden Note Transport Service"
edition.workspace      = true
homepage.workspace     = true
keywords               = ["messaging", "miden"]
license.workspace      = true
name                   = "miden-note-transport"
readme                 = "README.md"
repository.workspace   = true
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[features]
tracing-forest = ["miden-node-tracing/tracing-forest"]

[lib]
doctest = false

[dependencies]
anyhow                 = { workspace = true }
clap                   = { features = ["env", "string"], workspace = true }
miden-node-db          = { workspace = true }
miden-node-proto       = { workspace = true }
miden-node-proto-build = { workspace = true }
miden-node-tracing     = { workspace = true }
miden-node-utils       = { workspace = true }
miden-protocol         = { workspace = true }
prost                  = { workspace = true }
rusqlite               = { workspace = true }
thiserror              = { workspace = true }
tokio                  = { features = ["macros", "net", "rt-multi-thread"], workspace = true }
tokio-stream           = { features = ["net"], workspace = true }
tonic                  = { default-features = true, features = ["transport"], workspace = true }
tonic-health           = { workspace = true }
tonic-reflection       = { workspace = true }
tonic-web              = { workspace = true }
tower                  = { features = ["limit"], workspace = true }
tower-http             = { features = ["catch-panic"], workspace = true }

[build-dependencies]
miden-node-db = { workspace = true }

[dev-dependencies]
miden-protocol = { default-features = true, features = ["testing"], workspace = true }
reqwest        = { workspace = true }
tempfile       = { workspace = true }
