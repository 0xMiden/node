[package]
authors.workspace      = true
description            = "Miden node binary"
edition.workspace      = true
homepage.workspace     = true
keywords               = ["miden", "node"]
license.workspace      = true
name                   = "miden-node"
readme.workspace       = true
repository.workspace   = true
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[features]
tracing-forest = ["miden-node-block-producer/tracing-forest"]

[dependencies]
anyhow                    = { workspace = true }
axum                      = { workspace = true }
clap                      = { features = ["env", "string"], workspace = true }
fs-err                    = { workspace = true }
humantime                 = { workspace = true }
miden-node-block-producer = { workspace = true }
miden-node-proto          = { workspace = true }
miden-node-rpc            = { workspace = true }
miden-node-store          = { workspace = true }
miden-node-tracing        = { workspace = true }
miden-node-utils          = { workspace = true }
miden-protocol            = { workspace = true }
serde                     = { features = ["derive"], workspace = true }
serde_json                = { workspace = true }
thiserror                 = { workspace = true }
tokio                     = { features = ["macros", "net", "rt-multi-thread", "sync"], workspace = true }
tokio-stream              = { workspace = true }
tonic                     = { default-features = false, workspace = true }
url                       = { workspace = true }

[dev-dependencies]
miden-node-tracing = { features = ["tracing-forest"], workspace = true }
tempfile           = { workspace = true }
tower              = { features = ["util"], workspace = true }
