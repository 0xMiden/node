syntax = "proto3";
package note_transport;

import "google/protobuf/empty.proto";
import "note.proto";
import "block_number.proto";

// Delivers private notes to recipients that poll by tag.
service Api {
    // Stores a note. A retry with the same note ID keeps the first envelope.
    rpc SendNote(TransportNote) returns (google.protobuf.Empty) {}
    // Returns notes after the cursor, ordered by their storage cursor.
    rpc FetchNotes(FetchNotesRequest) returns (FetchNotesResponse) {}
}

message TransportNote {
    note.NoteHeader header = 1;
    note.NoteDetails details = 2;
    // Sender-supplied lower bound for the inclusion block. The service does not verify it.
    // An absent value differs from block zero.
    blockchain.BlockNumber after_block_num = 3;
}

message FetchNotesRequest {
    // At most 128 tags. Duplicate tags do not duplicate results.
    repeated fixed32 tags = 1;
    // Exclusive lower bound. Zero starts from the first retained note.
    fixed64 cursor = 2;
}

message FetchNotesResponse {
    repeated TransportNote notes = 1;
    // Cursor of the last returned note. An empty page keeps the request cursor.
    fixed64 cursor = 2;
    // Indicates that another page is available for these tags.
    bool has_more = 3;
}
