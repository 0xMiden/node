syntax = "proto3";
package miden.note_transport.v1;

import "note.proto";
import "block_number.proto";

// Delivers private notes to recipients that poll by tag.
service NoteTransportService {
    // Verifies inclusion against the trusted node before storage, including on retries.
    // Accepts only private notes. Rejects non-private notes with INVALID_ARGUMENT.
    // A retry with the same note ID keeps the first envelope.
    rpc SendNoteWithProof(SendNoteWithProofRequest) returns (SendNoteWithProofResponse) {}
    // Returns notes after the cursor, ordered by their storage cursor.
    rpc FetchNotes(FetchNotesRequest) returns (FetchNotesResponse) {}
}

message SendNoteWithProofRequest {
    // Required. The inclusion proof supplies the exact inclusion block.
    TransportNote note = 1;
    // Required. The service verifies this proof but does not store it.
    note.NoteInclusionProof inclusion_proof = 2;
}

message SendNoteWithProofResponse {}

message TransportNote {
    note.NoteHeader header = 1;
    note.NoteDetails details = 2;
}

// A stored note with a verified inclusion block.
message FetchedNote {
    note.NoteHeader header = 1;
    note.NoteDetails details = 2;
    // Required. The service verifies the exact inclusion block before storage.
    blockchain.BlockNumber committed_in_block = 4;
}

// Identifies a position in a stable sequence of stored notes.
message FetchNotesCursor {
    // Random nonce that identifies the sequence. Service restarts and note cleanup preserve it.
    // Recreating the database assigns a new nonce and invalidates previous cursors.
    // All unsigned 64-bit values are valid.
    fixed64 nonce = 1;
    // Exclusive lower bound. Zero starts from the first retained note.
    fixed64 sequence = 2;
}

message FetchNotesRequest {
    // Tags to fetch notes for. Accepts up to 128 tags.
    // Duplicate tags do not cause duplicate results.
    repeated fixed32 tags = 1;

    // Exclusive lower bound. Omit it to start from the first retained note.
    // Continue a page using the response cursor and the same tags and sync_to.
    //
    // For a chunked round, start every chunk from the shared round cursor.
    // Persist the response sync_to only after all chunks have been processed.
    // Removing tags needs no reset. Backfill newly added tags separately when
    // their retained history is required. Reordering or duplicating tags is harmless.
    // A nonce from another database generation returns FAILED_PRECONDITION.
    // Clear both bounds and restart after this error, deduplicating by note ID.
    FetchNotesCursor cursor = 2;

    // Inclusive upper bound. Omit it to use the database head for this request.
    // Use the resolved response bound for every page and chunk in one round.
    //
    // Both bounds must identify the current database generation. The upper bound
    // must not precede the lower bound or exceed the current database head.
    // Future lower bounds and sequences above i64::MAX return INVALID_ARGUMENT.
    // The bound does not prevent retention from removing expired notes.
    FetchNotesCursor sync_to = 3;
}

message FetchNotesResponse {
    repeated FetchedNote notes = 1;
    // Always present. Contains the sequence of the last returned note.
    // An empty page keeps the validated request cursor.
    // An initial empty page returns the current nonce and sequence zero.
    FetchNotesCursor cursor = 2;
    // More matching retained notes remain after this page and at or below sync_to.
    bool has_more = 3;
    // Always present. The inclusive upper bound used for this request.
    // When has_more is false, these tags are complete through this bound.
    FetchNotesCursor sync_to = 4;
}
