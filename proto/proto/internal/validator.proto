// Specification of the user facing gRPC API.
syntax = "proto3";
package validator;

import "block.proto";
import "primitives.proto";
import "protocol_config.proto";
import "types/block_proving.proto";
import "types/submission.proto";
import "google/protobuf/empty.proto";

// VALIDATOR API
// ================================================================================================

// Validator API for the Validator component.
service Api {
   // Returns the status info of the validator.
   rpc Status(google.protobuf.Empty) returns (ValidatorStatus) {}

   // Submits a transaction to the validator.
   rpc SubmitProvenTransaction(submission.ProvenTransactionSubmission) returns (google.protobuf.Empty) {}

   // Validates and signs a proposed block.
   rpc SignBlock(block_proving.BlockProofRequest) returns (SignBlockResponse) {}

   // Streams signed blocks starting from the given block number (inclusive).
   //
   // Replays backed-up blocks first, then streams live blocks as they are signed. Unlike the RPC
   // block subscription, the blocks streamed here carry no proofs; they must be commissioned
   // separately as part of recovery.
   rpc BlockSubscription(BlockSubscriptionRequest) returns (stream BlockSubscriptionResponse) {}

   // Returns the public key that clients use to encrypt the private inputs of the transactions
   // they submit, attested by this validator's own signing key.
   //
   // The encryption key is shared across the whole validator set, so the returned public key is
   // identical regardless of which validator serves the request. The attestation carried in the
   // response is specific to this validator.
   rpc GetTransactionEncryptionKey(google.protobuf.Empty) returns (submission.TransactionEncryptionKey) {}
}

// SIGN BLOCK RESPONSE
// ================================================================================================

message SignBlockResponse {
    primitives.Signature signature = 1;
    primitives.Word block_commitment = 2;
    primitives.PublicKey public_key = 3;
}

// BLOCK SUBSCRIPTION
// ================================================================================================

// Request to subscribe to the signed block stream.
message BlockSubscriptionRequest {
    // The block number to start streaming from (inclusive).
    fixed32 block_from = 1;
}

// A signed block streamed to a subscriber.
message BlockSubscriptionResponse {
    blockchain.SignedBlock block = 1;

    // The signed chain tip when this item was emitted.
    fixed32 committed_chain_tip = 2;

    // The active configuration. Included with the first response and when its commitment changes.
    // Verify its commitment against the accompanying block header.
    optional protocol_config.ProtocolConfig protocol_config = 3;
}

// VALIDATOR STATUS
// ================================================================================================

// Represents the status of the validator.
message ValidatorStatus {
    // The validator's running version.
    string version = 1;

    // The validator's status.
    string status = 2;

    // The validator's current chain tip (highest signed block number).
    fixed32 chain_tip = 3;

    // The total number of transactions validated by this validator.
    fixed64 validated_transactions_count = 4;

    // The total number of blocks signed by this validator.
    fixed64 signed_blocks_count = 5;
}
